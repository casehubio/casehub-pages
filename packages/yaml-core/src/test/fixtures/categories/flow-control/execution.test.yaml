name: Flow control — behavioral execution
tests:
  - name: if-else takes then branch on truthy condition
    steps:
      - if: "true"
        then:
          - assert: "true"
        else:
          - assert: "false"

  - name: if-else takes else branch on falsy condition
    steps:
      - if: "false"
        then:
          - assert: "false"
        else:
          - assert: "true"

  - name: match dispatches to matching case
    steps:
      - match: "beta"
        cases:
          - pattern: "alpha"
            assert: "false"
          - pattern: "beta"
            assert: "true"
          - default:
              - assert: "false"

  - name: match falls through to default
    steps:
      - match: "unknown"
        cases:
          - pattern: "alpha"
            assert: "false"
          - default:
              - assert: "true"

  - name: try-catch catches step failure
    steps:
      - try:
          - assert: "false"
        catch:
          - assert: "true"

  - name: try-finally runs finally after success
    steps:
      - try:
          - assert: "true"
        finally:
          - assert: "true"

  - name: block executes steps sequentially
    steps:
      - block:
          - assert: "true"
          - assert: "true"
