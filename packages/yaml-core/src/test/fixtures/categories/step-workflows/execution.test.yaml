name: Step workflows — behavioral execution
tests:
  - name: sequential steps execute in order
    steps:
      - assert: "true"
      - assert: "true"
      - assert: "true"

  - name: step failure stops pipeline
    steps:
      - try:
          - assert: "true"
          - assert: "false"
          - assert: "true"
        catch:
          - assert: "true"
