<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual YAML Builder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 24px;
      background: #1a1a2e;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header h1 { font-size: 16px; font-weight: 600; }
    header .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(255,255,255,0.15);
    }
    #builder-container {
      flex: 1;
      overflow: hidden;
    }
    pages-builder-shell {
      display: block;
      height: 100%;
      background: #fff;
    }
  </style>
</head>
<body>
  <header>
    <h1>CaseHub Visual YAML Builder</h1>
    <span class="badge">Phase 1 Preview</span>
  </header>
  <div id="builder-container"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
