<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="t-arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="380" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#e4e4e7">Two-Mode Editor: Structure Then Content</text>

  <!-- Left: Layout Mode -->
  <rect x="20" y="50" width="320" height="270" rx="8" fill="#1a1a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="180" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#fbbf24">Layout Mode</text>
  <text x="180" y="94" text-anchor="middle" font-size="10" fill="#64748b">Design the grid structure</text>

  <!-- Grid skeleton -->
  <rect x="40" y="112" width="280" height="170" rx="4" fill="#111827" stroke="#374151" stroke-width="1"/>

  <!-- Empty cells — the skeleton -->
  <rect x="48" y="120" width="128" height="74" rx="3" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="112" y="162" text-anchor="middle" font-size="10" fill="#f59e0b">6 × 2</text>
  <rect x="184" y="120" width="128" height="74" rx="3" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="248" y="162" text-anchor="middle" font-size="10" fill="#f59e0b">6 × 2</text>

  <rect x="48" y="202" width="264" height="34" rx="3" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="180" y="224" text-anchor="middle" font-size="10" fill="#f59e0b">12 × 1</text>

  <rect x="48" y="244" width="84" height="30" rx="3" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="90" y="264" text-anchor="middle" font-size="9" fill="#f59e0b">4 × 1</text>
  <rect x="140" y="244" width="84" height="30" rx="3" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="182" y="264" text-anchor="middle" font-size="9" fill="#f59e0b">4 × 1</text>
  <rect x="232" y="244" width="80" height="30" rx="3" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="272" y="264" text-anchor="middle" font-size="9" fill="#f59e0b">4 × 1</text>

  <!-- Tools -->
  <text x="180" y="305" text-anchor="middle" font-size="9" fill="#64748b">Split · Merge · Resize · Add Break</text>
  <text x="180" y="318" text-anchor="middle" font-size="9" fill="#94a3b8">No drag-and-drop — structural edits only</text>

  <!-- Arrow -->
  <line x1="345" y1="185" x2="415" y2="185" stroke="#3b82f6" stroke-width="2" marker-end="url(#t-arr)"/>
  <text x="380" y="175" text-anchor="middle" font-size="9" font-weight="600" fill="#3b82f6">then</text>

  <!-- Right: Content Mode -->
  <rect x="420" y="50" width="320" height="270" rx="8" fill="#1a1a2e" stroke="#22c55e" stroke-width="1.5"/>
  <text x="580" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#86efac">Content Mode</text>
  <text x="580" y="94" text-anchor="middle" font-size="10" fill="#64748b">Fill containers with components</text>

  <!-- Filled grid -->
  <rect x="440" y="112" width="280" height="170" rx="4" fill="#111827" stroke="#374151" stroke-width="1"/>

  <!-- Filled cells -->
  <rect x="448" y="120" width="128" height="74" rx="3" fill="#2563eb" opacity="0.85"/>
  <text x="512" y="152" text-anchor="middle" font-size="10" fill="white">Revenue Chart</text>
  <text x="512" y="166" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.6)">type: chart</text>

  <rect x="584" y="120" width="128" height="74" rx="3" fill="#9333ea" opacity="0.85"/>
  <text x="648" y="152" text-anchor="middle" font-size="10" fill="white">Orders Table</text>
  <text x="648" y="166" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.6)">type: table</text>

  <rect x="448" y="202" width="264" height="34" rx="3" fill="#059669" opacity="0.85"/>
  <text x="580" y="224" text-anchor="middle" font-size="10" fill="white">Summary KPI Bar</text>

  <rect x="448" y="244" width="84" height="30" rx="3" fill="#b45309" opacity="0.85"/>
  <text x="490" y="264" text-anchor="middle" font-size="9" fill="white">Filter</text>
  <rect x="540" y="244" width="84" height="30" rx="3" fill="#0891b2" opacity="0.85"/>
  <text x="582" y="264" text-anchor="middle" font-size="9" fill="white">Search</text>
  <rect x="632" y="244" width="80" height="30" rx="3" fill="#dc2626" opacity="0.85"/>
  <text x="672" y="264" text-anchor="middle" font-size="9" fill="white">Export</text>

  <!-- Tools -->
  <text x="580" y="305" text-anchor="middle" font-size="9" fill="#64748b">Drag from palette · Swap · Replace</text>
  <text x="580" y="318" text-anchor="middle" font-size="9" fill="#94a3b8">Containers are set — place content into them</text>
</svg>
