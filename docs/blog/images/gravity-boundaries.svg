<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="g-arr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="#94a3b8"/>
    </marker>
    <marker id="g-block" markerWidth="2" markerHeight="8" refX="1" refY="4" orient="auto">
      <rect width="2" height="8" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="380" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#e4e4e7">Row Breaks as Gravity Boundaries</text>

  <!-- Left: without breaks -->
  <rect x="20" y="45" width="340" height="320" rx="8" fill="#1a1a2e" stroke="#333" stroke-width="1"/>
  <text x="190" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="#94a3b8">Without Breaks</text>
  <text x="190" y="84" text-anchor="middle" font-size="10" fill="#64748b">Gravity pulls everything to the top</text>

  <!-- Grid without breaks -->
  <rect x="40" y="100" width="120" height="50" rx="4" fill="#2563eb" opacity="0.8"/>
  <text x="100" y="130" text-anchor="middle" font-size="10" fill="white">Chart A</text>
  <rect x="168" y="100" width="120" height="50" rx="4" fill="#9333ea" opacity="0.8"/>
  <text x="228" y="130" text-anchor="middle" font-size="10" fill="white">Chart B</text>

  <!-- Gap where panel was removed -->
  <rect x="40" y="158" width="120" height="30" rx="4" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="100" y="178" text-anchor="middle" font-size="9" fill="#475569">(removed)</text>

  <rect x="40" y="196" width="248" height="40" rx="4" fill="#059669" opacity="0.8"/>
  <text x="164" y="221" text-anchor="middle" font-size="10" fill="white">Summary Table</text>

  <!-- Gravity arrows -->
  <line x1="100" y1="192" x2="100" y2="162" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#g-arr)"/>
  <text x="100" y="260" text-anchor="middle" font-size="9" fill="#94a3b8">Table floats up past</text>
  <text x="100" y="274" text-anchor="middle" font-size="9" fill="#94a3b8">section boundary</text>

  <!-- Result arrow -->
  <text x="190" y="300" text-anchor="middle" font-size="10" fill="#ef4444">Summary mixes with charts</text>
  <text x="190" y="314" text-anchor="middle" font-size="10" fill="#ef4444">Sections lose identity</text>

  <!-- Right: with breaks -->
  <rect x="400" y="45" width="340" height="320" rx="8" fill="#1a1a2e" stroke="#22c55e" stroke-width="1.5"/>
  <text x="570" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="#86efac">With Row Breaks</text>
  <text x="570" y="84" text-anchor="middle" font-size="10" fill="#64748b">Gravity stops at break boundaries</text>

  <!-- Section 1: Charts -->
  <text x="424" y="106" font-size="9" font-weight="600" fill="#64748b">CHARTS</text>
  <rect x="420" y="112" width="120" height="50" rx="4" fill="#2563eb" opacity="0.8"/>
  <text x="480" y="142" text-anchor="middle" font-size="10" fill="white">Chart A</text>
  <rect x="548" y="112" width="120" height="50" rx="4" fill="#9333ea" opacity="0.8"/>
  <text x="608" y="142" text-anchor="middle" font-size="10" fill="white">Chart B</text>

  <!-- Gap in section 1 -->
  <rect x="420" y="170" width="120" height="30" rx="4" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="480" y="190" text-anchor="middle" font-size="9" fill="#475569">(removed)</text>

  <!-- Gravity arrow hitting break -->
  <line x1="480" y1="224" x2="480" y2="206" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="480" y="218" text-anchor="middle" font-size="8" fill="#94a3b8">gravity</text>

  <!-- Break line -->
  <rect x="416" y="226" width="308" height="4" rx="2" fill="#f59e0b" opacity="0.8"/>
  <text x="570" y="224" text-anchor="middle" font-size="8" font-weight="600" fill="#f59e0b">ROW BREAK</text>

  <!-- Block indicator -->
  <line x1="480" y1="226" x2="480" y2="226" stroke="#ef4444" stroke-width="6"/>

  <!-- Section 2: Summary -->
  <text x="424" y="250" font-size="9" font-weight="600" fill="#64748b">SUMMARY</text>
  <rect x="420" y="256" width="248" height="40" rx="4" fill="#059669" opacity="0.8"/>
  <text x="544" y="281" text-anchor="middle" font-size="10" fill="white">Summary Table</text>

  <!-- Result -->
  <text x="570" y="320" text-anchor="middle" font-size="10" fill="#22c55e">Table stays in its section</text>
  <text x="570" y="334" text-anchor="middle" font-size="10" fill="#22c55e">Sections maintain identity</text>

  <!-- Cross symbol on left gravity arrow -->
  <text x="118" y="178" font-size="14" fill="#ef4444">✗</text>
  <text x="498" y="218" font-size="11" fill="#ef4444">⊘</text>
</svg>
