<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Builder — CaseHub Pages</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; }
    .header { padding: 8px 16px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 12px; }
    .header h1 { font-size: 16px; font-weight: 500; }
    .header a { color: #60a5fa; text-decoration: none; font-size: 13px; }
    pages-builder-shell { display: block; height: calc(100vh - 41px); }
  </style>
</head>
<body>
  <div class="header">
    <h1>Grid Builder</h1>
    <a href="/">Back to Gallery</a>
  </div>
  <pages-builder-shell></pages-builder-shell>
  <script id="grid-yaml" type="text/yaml">
pages:
- name: Grid Layout
  items:
    - placement: { x: 0, y: 0, w: 4, h: 2 }
      component:
        type: title
        properties:
          text: Revenue Overview
          size: h3
    - placement: { x: 4, y: 0, w: 8, h: 2 }
      component:
        type: markdown
        properties:
          content: >
            Try DnD editing: hover over the preview, click Edit layout,
            then drag panels to reposition or resize. Click a + zone to
            insert a new panel. Changes round-trip through the YAML editor
            on the left. Use Ctrl+Z to undo.
    - placement: { x: 0, y: 2, w: 6, h: 3 }
      component:
        type: markdown
        properties:
          content: >
            Panel A — Drag me to a new position or resize from an edge.
            The YAML source updates in real time.
    - placement: { x: 6, y: 2, w: 6, h: 3 }
      component:
        type: markdown
        properties:
          content: >
            Panel B — Works alongside Panel A. The grid overlay shows
            insertion zones (+) at empty cells.
    - placement: { x: 0, y: 5, w: 12, h: 2 }
      component:
        type: markdown
        properties:
          content: >
            Full-width panel — Spans all 12 columns. Delete via the tree
            view (right-click), or move up/down with keyboard shortcuts.
  </script>
  <script src="builder-bundle.js"></script>
</body>
</html>
