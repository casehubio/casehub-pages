quarkus.http.port=8090
quarkus.http.cors=true

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/pages_demo
%prod.quarkus.datasource.username=pages
%prod.quarkus.datasource.password=pages

casehub.pages.push.max-events-per-topic=500

# Exclude auth-gated DataResource — demo uses its own unauthenticated endpoint
quarkus.arc.exclude-types=io.casehub.pages.data.DataResource,io.casehub.pages.data.DataCacheService,io.casehub.pages.data.RelayClient
