datasets:
  - uuid: apps
    url: /api/apps
    columns:
      - id: appId
        type: TEXT
      - id: name
        type: TEXT
      - id: displayName
        type: TEXT
      - id: source
        type: LABEL
      - id: enabled
        type: LABEL
      - id: collectionCount
        type: NUMBER
      - id: totalDocuments
        type: NUMBER
pages:
  - name: Apps
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
      - at: { x: 0, y: 1, w: 12, h: 1 }
        type: metric
        properties:
          lookup:
            uuid: apps
          columns:
            - field: appId
              accumulate: COUNT
              label: Total Apps
      - at: { x: 0, y: 2, w: 12, h: 1 }
        type: data-table
        properties:
          pageSize: 20
          sortable: true
          filter:
            enabled: true
          lookup:
            uuid: apps
          columns:
            - field: appId
              label: ID
            - field: name
              label: Name
            - field: source
              label: Source
            - field: enabled
              label: Status
            - field: collectionCount
              label: Collections
            - field: totalDocuments
              label: Documents
      - at: { x: 0, y: 3, w: 12, h: 1 }
      - at: { x: 0, y: 4, w: 12, h: 1 }
  - name: App Settings
    dataScope:
      dataset: apps
      idColumn: appId
    save:
      trigger: auto
      delay: 1500
      adapter: rest
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
      - at: { x: 0, y: 1, w: 12, h: 1 }
  - name: Lifecycle
    dataScope:
      dataset: apps
      idColumn: appId
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
      - at: { x: 0, y: 1, w: 12, h: 1 }
        type: markdown
        properties:
          content: |
            Current status: **#{enabled}**
      - at: { x: 0, y: 2, w: 12, h: 1 }
        type: action-button
        properties:
          label: Stop App
          style: danger
          url: /api/apps/#{appId}/lifecycle
          method: POST
          body:
            action: stop
          confirm: "Stop app #{appId}? Collections will return 404."
          disabledWhen: "#{enabled} == false"
          onSuccess:
            refresh:
              - apps
            message: "App #{appId} stopped"
      - at: { x: 0, y: 3, w: 12, h: 1 }
        type: action-button
        properties:
          label: Start App
          style: primary
          url: /api/apps/#{appId}/lifecycle
          method: POST
          body:
            action: start
          disabledWhen: "#{enabled} == true"
          onSuccess:
            refresh:
              - apps
            message: "App #{appId} started"
