datasets:
- uuid: tasks
  url: /api/apps/tasks/tasks
  mutable:
    keyColumn: id
    createUrl: /api/apps/tasks/tasks
    updateUrl: /api/apps/tasks/tasks/{id}
    deleteUrl: /api/apps/tasks/tasks/{id}
  columns:
  - id: id
    type: TEXT
  - id: title
    type: TEXT
  - id: description
    type: TEXT
  - id: priority
    type: LABEL
  - id: status
    type: LABEL
  - id: assignee
    type: TEXT
  - id: dueDate
    type: TEXT
  - id: tags
    type: TEXT

- uuid: notes
  url: /api/apps/tasks/notes
  mutable:
    keyColumn: id
    createUrl: /api/apps/tasks/notes
    updateUrl: /api/apps/tasks/notes/{id}
    deleteUrl: /api/apps/tasks/notes/{id}
  columns:
  - id: id
    type: TEXT
  - id: title
    type: TEXT
  - id: content
    type: TEXT
  - id: category
    type: LABEL
  - id: author
    type: TEXT
  - id: pinned
    type: LABEL

pages:
- name: index
  components:
  - type: tabs
    properties:
      navGroupId: TasksNav
      width: 100%

- name: Task Board
  rows:
  - columns:
    - span: 3
      components:
      - type: title
        properties:
          text: Open Tasks
          size: h3
      - type: metric
        properties:
          lookup:
            uuid: tasks
            filter:
            - column: status
              function: NOT_EQUALS_TO
              args:
              - DONE
            - column: status
              function: NOT_EQUALS_TO
              args:
              - CANCELLED
            group:
            - functions:
              - source: id
                function: COUNT
          columns:
          - id: id
            pattern: '#'
    - span: 3
      components:
      - type: title
        properties:
          text: Critical
          size: h3
      - type: metric
        properties:
          lookup:
            uuid: tasks
            filter:
            - column: priority
              function: EQUALS_TO
              args:
              - CRITICAL
            - column: status
              function: NOT_EQUALS_TO
              args:
              - DONE
            group:
            - functions:
              - source: id
                function: COUNT
          columns:
          - id: id
            pattern: '#'
    - span: 3
      components:
      - type: title
        properties:
          text: In Progress
          size: h3
      - type: metric
        properties:
          lookup:
            uuid: tasks
            filter:
            - column: status
              function: EQUALS_TO
              args:
              - IN_PROGRESS
            group:
            - functions:
              - source: id
                function: COUNT
          columns:
          - id: id
            pattern: '#'
    - span: 3
      components:
      - type: title
        properties:
          text: Done
          size: h3
      - type: metric
        properties:
          lookup:
            uuid: tasks
            filter:
            - column: status
              function: EQUALS_TO
              args:
              - DONE
            group:
            - functions:
              - source: id
                function: COUNT
          columns:
          - id: id
            pattern: '#'
  - columns:
    - span: 4
      components:
      - type: title
        properties:
          text: By Priority
          size: h3
      - type: pie-chart
        properties:
          filter:
            listening: true
          lookup:
            uuid: tasks
            filter:
            - column: status
              function: NOT_EQUALS_TO
              args:
              - DONE
            - column: status
              function: NOT_EQUALS_TO
              args:
              - CANCELLED
            group:
            - columnGroup:
                source: priority
              functions:
              - source: priority
              - source: id
                function: COUNT
    - span: 4
      components:
      - type: title
        properties:
          text: By Status
          size: h3
      - type: bar-chart
        properties:
          filter:
            listening: true
          lookup:
            uuid: tasks
            group:
            - columnGroup:
                source: status
              functions:
              - source: status
              - source: id
                function: COUNT
    - span: 4
      components:
      - type: title
        properties:
          text: By Assignee
          size: h3
      - type: pie-chart
        properties:
          subtype: donut
          filter:
            listening: true
          lookup:
            uuid: tasks
            filter:
            - column: status
              function: NOT_EQUALS_TO
              args:
              - DONE
            - column: assignee
              function: NOT_NULL
            group:
            - columnGroup:
                source: assignee
              functions:
              - source: assignee
              - source: id
                function: COUNT
  - columns:
    - components:
      - type: data-table
        properties:
          pageSize: 15
          sortable: true
          filter:
            listening: true
            notification: true
          lookup:
            uuid: tasks
          columns:
          - id: title
          - id: priority
          - id: status
          - id: assignee
          - id: dueDate

- name: Task Detail
  dataScope:
    dataset: tasks
    idColumn: id
  save:
    trigger: auto
    delay: 2000
    adapter: rest
  components:
  - type: title
    properties:
      text: Task Detail
      size: h2
  - input:
      field: title
      label: Title
      required: true
  - textarea:
      field: description
      label: Description
      rows: 4
  - select:
      field: priority
      label: Priority
      options:
        values:
        - LOW
        - MEDIUM
        - HIGH
        - CRITICAL
  - select:
      field: status
      label: Status
      options:
        values:
        - TODO
        - IN_PROGRESS
        - REVIEW
        - DONE
        - CANCELLED
  - input:
      field: assignee
      label: Assignee
  - input:
      field: dueDate
      label: Due Date
  - input:
      field: tags
      label: Tags

- name: New Task
  components:
  - type: title
    properties:
      text: Create Task
      size: h2
  - schema-form:
      schema:
        properties:
          title: { type: string, minLength: 1 }
          description: { type: string, format: textarea }
          priority: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
          assignee: { type: string }
          dueDate: { type: string }
          tags: { type: string }
        required: [title, priority]
      forceCreate: true
      submitUrl: /api/apps/tasks/tasks
      submitMethod: POST

- name: Notes
  rows:
  - columns:
    - span: 4
      components:
      - type: selector
        properties:
          subtype: labels
          filter:
            selfApply: true
            notification: true
          lookup:
            uuid: notes
            group:
            - columnGroup:
                source: category
              functions:
              - source: category
  - columns:
    - components:
      - type: data-table
        properties:
          pageSize: 10
          sortable: true
          filter:
            listening: true
          lookup:
            uuid: notes
          columns:
          - id: title
          - id: category
          - id: author
          - id: pinned

navTree:
  root_items:
  - type: GROUP
    id: TasksNav
    children:
    - page: Task Board
    - page: Task Detail
    - page: New Task
    - page: Notes
