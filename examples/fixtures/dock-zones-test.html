<!DOCTYPE html>
<html lang="en" class="pages-theme-casehub-dark">
<head>
  <meta charset="utf-8" />
  <title>Tool Window Docking — Zone Test</title>
  <script src="/casehub-bundle.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
    h3 { margin: 0.5rem 1rem; font-size: 0.85rem; color: var(--pages-neutral-10, #888); }
    #target { flex: 1; overflow: hidden; }
    .panel-content {
      padding: 1rem;
      height: 100%;
    }
    .panel-content h2 { margin: 0 0 0.5rem; font-size: 1rem; }
    .panel-content p { margin: 0; font-size: 0.85rem; color: var(--pages-neutral-9, #aaa); }
  </style>
</head>
<body>
  <h3>Issue #75 — Tool Window Docking (drag buttons between zones to rearrange)</h3>
  <div id="target"></div>

  <script>
    const { loadSite, createZoneLayoutEngine } = window.casehubPages;

    const config = {
      storageKey: "dock-zone-test",
      centre: {
        type: "html",
        props: { content: '<div class="panel-content"><h2>Centre Content</h2><p>Main workspace area. Panels dock around this.</p></div>' },
      },
      left: {
        zones: 2,
        panels: [
          {
            key: "navigator",
            label: "Navigator",
            icon: "\u{1F4C1}",
            zone: "top",
            defaultOpen: true,
            content: { type: "html", props: { content: '<div class="panel-content"><h2>Navigator</h2><p>Fixed panel &mdash; cannot be dragged.</p></div>' } },
            fixed: true,
          },
          {
            key: "files",
            label: "Files",
            icon: "\u{1F4C4}",
            zone: "top",
            content: { type: "html", props: { content: '<div class="panel-content"><h2>Files</h2><p>Drag this button to move it.</p></div>' } },
          },
          {
            key: "bookmarks",
            label: "Bookmarks",
            icon: "\u{1F516}",
            zone: "bottom",
            content: { type: "html", props: { content: '<div class="panel-content"><h2>Bookmarks</h2><p>In the bottom-left zone.</p></div>' } },
          },
        ],
      },
      right: {
        zones: 1,
        panels: [
          {
            key: "agent",
            label: "Agent",
            icon: "\u{1F916}",
            defaultOpen: true,
            allowedZones: ["right-top", "right-bottom", "bottom-left", "bottom-right"],
            content: { type: "html", props: { content: '<div class="panel-content"><h2>Agent</h2><p>Constrained &mdash; can only move to right or bottom zones.</p></div>' } },
          },
          {
            key: "inspector",
            label: "Inspector",
            icon: "\u{1F50D}",
            content: { type: "html", props: { content: '<div class="panel-content"><h2>Inspector</h2><p>Drag anywhere.</p></div>' } },
          },
        ],
      },
      bottom: {
        zones: 1,
        panels: [
          {
            key: "console",
            label: "Console",
            icon: "⌨️",
            defaultOpen: true,
            content: { type: "html", props: { content: '<div class="panel-content"><h2>Console</h2><p>Bottom zone panel.</p></div>' } },
          },
          {
            key: "output",
            label: "Output",
            icon: "\u{1F4CB}",
            content: { type: "html", props: { content: '<div class="panel-content"><h2>Output</h2><p>Another bottom panel.</p></div>' } },
          },
        ],
      },
      statusBar: {
        type: "html",
        props: { content: '<div style="padding: 2px 8px; font-size: 12px; color: var(--pages-neutral-8, #888); display: flex; justify-content: space-between; align-items: center;"><span>Status: Ready &mdash; Branch: issue-75-tool-window-docking</span><button id="theme-toggle" style="border: 1px solid var(--pages-neutral-5, #555); background: var(--pages-surface-1, transparent); color: inherit; border-radius: 4px; padding: 1px 8px; cursor: pointer; font-size: 11px;">Light</button></div>' },
      },
    };

    const engine = createZoneLayoutEngine(config);
    const tree = engine.buildTree();
    const target = document.getElementById("target");

    loadSite(target, tree, {
      zoneEngine: engine,
    }).then(site => {
      console.log("Site loaded. Zone map:", Object.fromEntries(engine.zoneMap));
      window._site = site;
      window._engine = engine;

      const btn = document.getElementById("theme-toggle");
      let dark = true;
      btn.addEventListener("click", () => {
        dark = !dark;
        const { applyTheme } = window.casehubPages;
        const mode = dark ? "dark" : "light";
        applyTheme("casehub-" + mode, target);
        document.documentElement.className = "pages-theme-casehub-" + mode;
        target.style.background = "var(--pages-neutral-3)";
        target.style.color = "var(--pages-neutral-12)";
        btn.textContent = dark ? "Light" : "Dark";
      });
    });
  </script>
</body>
</html>
