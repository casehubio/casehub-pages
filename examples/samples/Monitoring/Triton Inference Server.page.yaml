properties:
  metricsUrl: /data/triton/metrics
datasets:
  - uuid: metrics
    url: ${metricsUrl}
    columns:
      - id: metric
        type: LABEL
      - id: labels
        type: LABEL
      - id: value
        type: NUMBER
pages:
  - properties:
      margin-left: 5px
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
        properties:
          font-size: x-large
          margin: 13px
      - at: { x: 0, y: 1, w: 3, h: 1 }
        type: title
        properties:
          text: Running Models
          size: h3
      - at: { x: 0, y: 2, w: 3, h: 1 }
        type: metric
        properties:
          lookup:
            uuid: metrics
            filter:
              - column: metric
                function: EQUALS_TO
                args:
                  - nv_inference_count
            group:
              - functions:
                  - source: labels
                    function: COUNT
          columns:
            - id: labels
              pattern: "#"
      - at: { x: 3, y: 1, w: 3, h: 1 }
        type: title
        properties:
          text: Inference Count
          size: h3
      - at: { x: 3, y: 2, w: 3, h: 1 }
        type: metric
        properties:
          visible: "true"
          lookup:
            uuid: metrics
            filter:
              - column: metric
                function: EQUALS_TO
                args:
                  - nv_inference_count
            group:
              - functions:
                  - source: value
                    function: SUM
          columns:
            - id: value
              pattern: "#"
      - at: { x: 6, y: 1, w: 3, h: 1 }
        type: title
        properties:
          text: Inference Requests Success
          size: h3
      - at: { x: 6, y: 2, w: 3, h: 1 }
        type: metric
        properties:
          visible: "true"
          lookup:
            uuid: metrics
            filter:
              - column: metric
                function: EQUALS_TO
                args:
                  - nv_inference_request_success
            group:
              - functions:
                  - source: value
                    function: SUM
          columns:
            - id: value
              pattern: "#"
      - at: { x: 9, y: 1, w: 3, h: 1 }
        type: title
        properties:
          text: Inference Requests Failure
          size: h3
      - at: { x: 9, y: 2, w: 3, h: 1 }
        type: metric
        properties:
          visible: "true"
          lookup:
            uuid: metrics
            filter:
              - column: metric
                function: EQUALS_TO
                args:
                  - nv_inference_request_failure
            group:
              - functions:
                  - source: value
                    function: SUM
          columns:
            - id: value
              pattern: "#"
      - at: { x: 0, y: 3, w: 12, h: 1 }
      - at: { x: 0, y: 4, w: 12, h: 1 }
        type: selector
        properties:
          filter:
            notification: "true"
          lookup:
            uuid: metrics
            filter:
              - column: metric
                function: EQUALS_TO
                args:
                  - nv_inference_count
            group:
              - columnGroup:
                  source: labels
                functions:
                  - source: labels
                    column: model
          columns:
            - id: model
              expression: value.replaceAll("\"", "").replaceAll("model=", "").replaceAll("version=", "").replaceAll(",", " v")
      - at: { x: 0, y: 5, w: 4, h: 1 }
        type: title
        properties:
          text: Inference Count
          size: h3
      - at: { x: 0, y: 6, w: 4, h: 1 }
        type: bar-chart
        properties:
          filter:
            listening: "true"
          lookup:
            uuid: metrics
            sort:
              - column: value
                sortOrder: DESCENDING
            filter:
              - column: metric
                function: EQUALS_TO
                args:
                  - nv_inference_count
              - column: value
                function: GREATER_THAN
                args:
                  - 0
            group:
              - columnGroup:
                  source: labels
                functions:
                  - source: labels
                  - source: value
                    function: SUM
          columns:
            - id: labels
              expression: value.replaceAll("\"", "").replaceAll("model=", "").replaceAll("version=", "").replaceAll(",", " v")
            - id: value
              pattern: "#"
      - at: { x: 4, y: 5, w: 4, h: 1 }
        type: title
        properties:
          text: Sucessful Inferences
          size: h3
      - at: { x: 4, y: 6, w: 4, h: 1 }
        type: bar-chart
        properties:
          filter:
            listening: "true"
          lookup:
            uuid: metrics
            sort:
              - column: value
                sortOrder: DESCENDING
            filter:
              - column: metric
                function: EQUALS_TO
                args:
                  - nv_inference_request_success
              - column: value
                function: GREATER_THAN
                args:
                  - 0
            group:
              - columnGroup:
                  source: labels
                functions:
                  - source: labels
                  - source: value
                    function: SUM
          columns:
            - id: labels
              expression: value.replaceAll("\"", "").replaceAll("model=", "").replaceAll("version=", "").replaceAll(",", " v")
            - id: value
              pattern: "#"
      - at: { x: 8, y: 5, w: 4, h: 1 }
        type: title
        properties:
          text: Failed Inferences
          size: h3
      - at: { x: 8, y: 6, w: 4, h: 1 }
        type: bar-chart
        properties:
          filter:
            listening: "true"
          lookup:
            uuid: metrics
            sort:
              - column: value
                sortOrder: DESCENDING
            filter:
              - column: metric
                function: EQUALS_TO
                args:
                  - nv_inference_request_failure
              - column: value
                function: GREATER_THAN
                args:
                  - 0
            group:
              - columnGroup:
                  source: labels
                functions:
                  - source: labels
                  - source: value
                    function: SUM
          columns:
            - id: labels
              expression: value.replaceAll("\"", "").replaceAll("model=", "").replaceAll("version=", "").replaceAll(",", " v")
            - id: value
              pattern: "#"
      - at: { x: 0, y: 7, w: 4, h: 1 }
        type: title
        properties:
          text: Inference Request Duration
          size: h3
      - at: { x: 0, y: 8, w: 4, h: 1 }
        type: bar-chart
        properties:
          filter:
            listening: "true"
          lookup:
            uuid: metrics
            sort:
              - column: value
                sortOrder: DESCENDING
            filter:
              - column: metric
                function: EQUALS_TO
                args:
                  - nv_inference_request_duration_us
            group:
              - columnGroup:
                  source: labels
                functions:
                  - source: labels
                  - source: value
                    column: Duration
          columns:
            - id: labels
              expression: value.replaceAll("\"", "").replaceAll("model=", "").replaceAll("version=", "").replaceAll(",", " v")
          axis:
            x:
              labels_angle: 15
      - at: { x: 4, y: 7, w: 4, h: 1 }
        type: title
        properties:
          text: Inference Total Duration
          size: h3
      - at: { x: 4, y: 8, w: 4, h: 1 }
        type: bar-chart
        properties:
          filter:
            listening: "true"
          lookup:
            uuid: metrics
            sort:
              - column: value
                sortOrder: DESCENDING
            filter:
              - column: metric
                function: EQUALS_TO
                args:
                  - nv_inference_compute_infer_duration_us
              - column: value
                function: GREATER_THAN
                args:
                  - 0
            group:
              - columnGroup:
                  source: labels
                functions:
                  - source: labels
                  - source: value
                    column: Duration
          columns:
            - id: labels
              expression: value.replaceAll("\"", "").replaceAll("model=", "").replaceAll("version=", "").replaceAll(",", " v")
      - at: { x: 8, y: 7, w: 4, h: 1 }
        type: title
        properties:
          text: Queue Wait
          size: h3
      - at: { x: 8, y: 8, w: 4, h: 1 }
        type: bar-chart
        properties:
          filter:
            listening: "true"
          lookup:
            uuid: metrics
            sort:
              - column: value
                sortOrder: DESCENDING
            filter:
              - column: metric
                function: EQUALS_TO
                args:
                  - nv_inference_queue_duration_us
              - column: value
                function: GREATER_THAN
                args:
                  - 0
            group:
              - columnGroup:
                  source: labels
                functions:
                  - source: labels
                  - source: value
                    column: Duration
          columns:
            - id: labels
              expression: value.replaceAll("\"", "").replaceAll("model=", "").replaceAll("version=", "").replaceAll(",", " v")
