pages:
  - grid:
      - at: { x: 0, y: 0, w: 6, h: 1 }
      - at: { x: 0, y: 1, w: 6, h: 1 }
        type: map
        properties:
          lookup:
            uuid: countries
            group:
              - columnGroup:
                  source: Country
                functions:
                  - source: Country
                  - source: Value
      - at: { x: 6, y: 0, w: 6, h: 1 }
      - at: { x: 6, y: 1, w: 6, h: 1 }
        type: map
        properties:
          subtype: markers
          lookup:
            uuid: countries
            group:
              - columnGroup:
                  source: Country
                functions:
                  - source: Country
                  - source: Value
datasets:
  - uuid: countries
    content: |-
      [
        ["Brazil", 6],
        ["USA", 3],
        ["China", 5],
        ["India", 5],
        ["Russia", 6],
        ["Canada", 6],
        ["Australia", 9],
        ["Mali", 4],
        ["South Africa", 11]
      ]
    columns:
      - id: Country
        type: LABEL
      - id: Value
        type: NUMBER
