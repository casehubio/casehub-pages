pages:
- name: Parameterized Script
  properties:
    margin: 20px
  rows:
  - columns:
    - span: 8
      components:
      - type: html
        properties:
          content: |
            <div>
              <h2 style="margin: 0 0 16px; color: var(--pages-text-primary, #eee);">Project Setup</h2>
              <form id="project-form" style="display: flex; flex-direction: column; gap: 12px; max-width: 500px;">
                <div>
                  <label style="display: block; margin-bottom: 4px; font-size: 13px; color: var(--pages-text-muted, #999);">Project Name</label>
                  <input aria-label="Project Name" role="textbox"
                    style="width: 100%; padding: 8px 12px; border: 1px solid var(--pages-border-subtle, #444); border-radius: 6px; background: var(--pages-surface-secondary, #2a2a3e); color: var(--pages-text-primary, #eee); font-size: 14px; box-sizing: border-box;" />
                </div>
                <div>
                  <label style="display: block; margin-bottom: 4px; font-size: 13px; color: var(--pages-text-muted, #999);">Template</label>
                  <select aria-label="Template" role="listbox"
                    style="width: 100%; padding: 8px 12px; border: 1px solid var(--pages-border-subtle, #444); border-radius: 6px; background: var(--pages-surface-secondary, #2a2a3e); color: var(--pages-text-primary, #eee); font-size: 14px;">
                    <option value="">Select template...</option>
                    <option value="blank">Blank</option>
                    <option value="starter">Starter</option>
                    <option value="enterprise">Enterprise</option>
                  </select>
                </div>
                <div>
                  <label style="display: block; margin-bottom: 4px; font-size: 13px; color: var(--pages-text-muted, #999);">Team Size</label>
                  <input aria-label="Team Size" type="number" role="textbox" value="5"
                    style="width: 100%; padding: 8px 12px; border: 1px solid var(--pages-border-subtle, #444); border-radius: 6px; background: var(--pages-surface-secondary, #2a2a3e); color: var(--pages-text-primary, #eee); font-size: 14px; box-sizing: border-box;" />
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                  <input aria-label="Enable CI" type="checkbox" role="checkbox" checked
                    style="width: 18px; height: 18px; cursor: pointer;" />
                  <label style="font-size: 14px; color: var(--pages-text-primary, #eee);">Enable CI Pipeline</label>
                </div>
                <div style="display: flex; gap: 8px; margin-top: 8px;">
                  <button type="button" aria-label="Create Project" role="button"
                    style="padding: 8px 24px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px;">Create Project</button>
                  <button type="button" aria-label="Reset" role="button"
                    style="padding: 8px 24px; background: var(--pages-surface-tertiary, #333); color: var(--pages-text-primary, #eee); border: 1px solid var(--pages-border-subtle, #444); border-radius: 6px; cursor: pointer; font-size: 14px;">Reset</button>
                </div>
              </form>
              <div id="project-status" style="margin-top: 16px; padding: 12px; border-radius: 6px; display: none;"></div>
            </div>
    - span: 4
      components:
      - type: html
        properties:
          content: |
            <div style="background: var(--pages-surface-tertiary, #1a1a2e); border: 1px solid var(--pages-border-subtle, #333); border-radius: 8px; padding: 16px;">
              <h3 style="margin: 0 0 8px; color: var(--pages-text-primary, #eee); font-size: 16px;">Parameters</h3>
              <p style="margin: 0 0 12px; color: var(--pages-text-muted, #888); font-size: 12px;">
                Customize parameters before running the script. Required params are marked with *.
              </p>
              <div id="param-form" style="display: flex; flex-direction: column; gap: 10px;"></div>
              <button id="run-param-btn" style="margin-top: 12px; width: 100%; padding: 8px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;">Run with Parameters</button>
            </div>
