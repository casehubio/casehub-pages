pages:
- name: Table Population
  properties:
    margin: 20px
  rows:
  - columns:
    - components:
      - type: html
        properties:
          content: |
            <div>
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h2 style="margin: 0; color: var(--pages-text-primary, #eee);">Sprint Team Roster</h2>
                <div id="table-controls" style="display: flex; gap: 8px;"></div>
              </div>
              <table role="grid" aria-label="Team Roster" style="width: 100%; border-collapse: collapse; background: var(--pages-surface-secondary, #2a2a3e); border-radius: 8px; overflow: hidden;">
                <thead>
                  <tr style="background: var(--pages-surface-tertiary, #1a1a2e);">
                    <th style="padding: 10px 16px; text-align: left; font-size: 12px; color: var(--pages-text-muted, #888); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">#</th>
                    <th style="padding: 10px 16px; text-align: left; font-size: 12px; color: var(--pages-text-muted, #888); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Name</th>
                    <th style="padding: 10px 16px; text-align: left; font-size: 12px; color: var(--pages-text-muted, #888); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Role</th>
                    <th style="padding: 10px 16px; text-align: left; font-size: 12px; color: var(--pages-text-muted, #888); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Capacity</th>
                    <th style="padding: 10px 16px; text-align: center; font-size: 12px; color: var(--pages-text-muted, #888); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Active</th>
                  </tr>
                </thead>
                <tbody id="team-table-body"></tbody>
              </table>
              <div id="table-status" style="margin-top: 12px; font-size: 12px; color: var(--pages-text-muted, #888);"></div>
            </div>
