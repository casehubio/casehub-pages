pages:
- name: Step Catalog
  properties:
    margin: 20px
  rows:
  - columns:
    - span: 12
      components:
      - type: html
        properties:
          content: |
            <div style="display: flex; gap: 16px; height: calc(100vh - 80px);">
              <div style="flex: 1; background: var(--pages-neutral-1); border: 1px solid var(--pages-neutral-4); border-radius: 8px; overflow: hidden;">
                <div style="padding: 12px 16px; border-bottom: 1px solid var(--pages-neutral-4);">
                  <span style="font-size: 14px; font-weight: 600; color: var(--pages-neutral-12);">Step Catalog</span>
                  <span style="font-size: 11px; color: var(--pages-neutral-9); margin-left: 8px;">Browse available step actions</span>
                </div>
                <pages-action-catalog id="step-catalog"
                  style="height: calc(100% - 45px); overflow-y: auto;">
                </pages-action-catalog>
              </div>
              <div style="flex: 1; background: var(--pages-neutral-1); border: 1px solid var(--pages-neutral-4); border-radius: 8px; overflow: hidden;">
                <div style="padding: 12px 16px; border-bottom: 1px solid var(--pages-neutral-4); display: flex; justify-content: space-between; align-items: center;">
                  <span style="font-size: 14px; font-weight: 600; color: var(--pages-neutral-12);">Template Output</span>
                  <span id="template-badge" style="font-size: 11px; padding: 2px 8px; background: rgba(34, 197, 94, 0.2); color: #4ade80; border-radius: 10px; display: none;">Copied</span>
                </div>
                <pre id="template-output" style="padding: 16px; font-size: 13px; color: var(--pages-neutral-12); background: var(--pages-neutral-2); margin: 0; height: calc(100% - 45px); overflow-y: auto; white-space: pre-wrap;">Select an action and click "Use Template" to see the generated YAML here.</pre>
              </div>
            </div>
