pages:
- name: UI Automation
  properties:
    margin: 20px
  rows:
  - columns:
    - span: 8
      components:
      - type: html
        properties:
          content: |
            <div>
              <h2 style="margin: 0 0 16px; color: var(--pages-neutral-12);">UI Automation</h2>
              <div id="ua-content"></div>
              <div id="ua-status" style="margin-top: 16px; padding: 12px; border-radius: 6px; display: none;"></div>
            </div>
    - span: 4
      components:
      - type: html
        properties:
          content: |
            <div style="background: var(--pages-neutral-1); border: 1px solid var(--pages-neutral-4); border-radius: 8px; padding: 16px;">
              <h3 style="margin: 0 0 8px; color: var(--pages-neutral-12); font-size: 16px;">Examples</h3>
              <p style="margin: 0 0 12px; color: var(--pages-neutral-9); font-size: 12px;">
                Each example demonstrates a different ARIA-based automation pattern.
              </p>
              <select id="ua-example-picker" style="width: 100%; padding: 8px 12px; border: 1px solid var(--pages-neutral-5); border-radius: 6px; background: var(--pages-neutral-2); color: var(--pages-neutral-12); font-size: 13px; margin-bottom: 12px;">
                <option value="0">Ticket Intake</option>
                <option value="1">Composable Workflow</option>
                <option value="2">Parameterized Setup</option>
                <option value="3">Team Roster</option>
              </select>
              <div style="font-size: 12px; color: var(--pages-neutral-9); margin-bottom: 12px;" id="ua-description"></div>
              <div id="ua-controls" style="display: flex; flex-direction: column; gap: 8px;"></div>
            </div>
