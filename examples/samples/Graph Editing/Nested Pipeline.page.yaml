pages:
  - name: Nested Pipeline
    components:
      - type: markdown
        properties:
          content: |
            Interactive data pipeline with drill-down navigation.

            **Drill down:** Click **⤢** on a drillable node to explore its sub-graph &bull; Click the vertical bars to navigate back &bull; **Escape** pops one level &bull; **Home** returns to root

            **Edit:** Click palette items to add nodes &bull; Drag handles to connect &bull; Click edges to insert &bull; Select + Delete to remove &bull; Hold ~300ms to drag-move

      - type: html
        properties:
          content: |
            <div style="display: flex; gap: 12px; height: 520px;">
              <pages-diagram-palette id="drill-palette" paletteId="pipeline-editor" style="width: 160px; flex-shrink: 0; border: 1px solid var(--pages-neutral-4, #d1d5db); border-radius: 8px; padding: 8px; overflow-y: auto;"></pages-diagram-palette>
              <div style="flex: 1; display: flex; flex-direction: column;">
                <graph-canvas-core id="nested-pipeline-canvas" style="flex: 1; display: block; border: 1px solid var(--pages-neutral-4, #d1d5db); border-radius: 8px; overflow: hidden;"></graph-canvas-core>
              </div>
              <div id="drill-props-panel" style="width: 240px; flex-shrink: 0; border: 1px solid var(--pages-neutral-4, #d1d5db); border-radius: 8px; padding: 12px; overflow-y: auto; background: var(--pages-neutral-2, #fafafa);">
                <div id="drill-props-empty" style="color: var(--pages-neutral-8, #9ca3af); font-size: 13px; font-family: var(--pages-font-family, system-ui); text-align: center; margin-top: 40px;">
                  Click a node to view properties
                </div>
                <div id="drill-props-header" style="display: none; margin-bottom: 8px;">
                  <span id="drill-props-type" style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--pages-neutral-8, #9ca3af); font-family: var(--pages-font-family, system-ui);"></span>
                  <div id="drill-props-name" style="font-size: 15px; font-weight: 600; color: var(--pages-neutral-12, #111); font-family: var(--pages-font-family, system-ui);"></div>
                </div>
                <pages-property-palette id="drill-props-palette" style="display: none;"></pages-property-palette>
              </div>
            </div>
