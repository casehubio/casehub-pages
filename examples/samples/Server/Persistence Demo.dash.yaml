properties:
  pushUrl: ws://localhost:8090/ws/push
  apiBase: http://localhost:8090

datasets:
  - id: storeInfo
    url: "${apiBase}/api/demo/info"
  - id: events
    url: "${pushUrl}"

pages:
  - name: Durable Persistence Demo
    rows:
      - columns:
          - components:
              - type: html
                properties:
                  content: |
                    <div style="padding: 20px; background: var(--pages-surface-tertiary, #1a1a2e); border: 1px solid var(--pages-border-subtle, #333); border-radius: 8px; margin-bottom: 16px;">
                      <h2 style="margin: 0 0 8px; color: var(--pages-text-primary, #eee); font-size: 20px;">Durable EventStore</h2>
                      <p style="margin: 0 0 12px; color: var(--pages-text-muted, #999); font-size: 14px;">
                        Events persist in PostgreSQL via <code style="background: var(--pages-surface-secondary, #2a2a3e); padding: 2px 6px; border-radius: 3px;">push-store-jdbc</code>.
                        Restart the server with <code style="background: var(--pages-surface-secondary, #2a2a3e); padding: 2px 6px; border-radius: 3px;">docker compose restart server</code>,
                        then reload — events survive.
                      </p>
                      <p style="margin: 0; color: var(--pages-text-muted, #888); font-size: 13px;">
                        ▸ Start the backend: <code style="background: var(--pages-surface-secondary, #2a2a3e); padding: 2px 6px; border-radius: 3px;">docker compose up</code> in <code style="background: var(--pages-surface-secondary, #2a2a3e); padding: 2px 6px; border-radius: 3px;">examples/</code>
                      </p>
                    </div>
      - columns:
          - span: 4
            components:
              - type: metric
                lookup: { dataSetId: storeInfo }
                props:
                  label: "Store Type"
                  value: "#{datasets.storeInfo.first.storeType}"
          - span: 4
            components:
              - type: metric
                lookup: { dataSetId: storeInfo }
                props:
                  label: "Total Events"
                  value: "#{datasets.storeInfo.first.totalEvents}"
          - span: 4
            components:
              - type: metric
                lookup: { dataSetId: storeInfo }
                props:
                  label: "Topics"
                  value: "#{datasets.storeInfo.first.topicCount}"
      - columns:
          - components:
              - type: event-timeline
                lookup: { dataSetId: events }
