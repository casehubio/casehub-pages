pages:
  - name: Two Forms
    properties:
      rowHeight: 60
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
        type: title
        properties:
          text: Patient Intake
          size: h2
      - at: { x: 0, y: 1, w: 6, h: 5 }
        type: panel
        properties:
          title: Personal Details
        grid:
          - at: { x: 0, y: 0, w: 3, h: 1 }
            type: html
            properties:
              content: '<div style="background:#3b82f6;border-radius:6px;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600">First Name</div>'
          - at: { x: 3, y: 0, w: 3, h: 1 }
            type: html
            properties:
              content: '<div style="background:#3b82f6;border-radius:6px;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600">Last Name</div>'
          - at: { x: 0, y: 1, w: 6, h: 1 }
            type: html
            properties:
              content: '<div style="background:#60a5fa;border-radius:6px;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600">Email</div>'
          - at: { x: 0, y: 2, w: 3, h: 1 }
            type: html
            properties:
              content: '<div style="background:#60a5fa;border-radius:6px;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600">Phone</div>'
          - at: { x: 3, y: 2, w: 3, h: 1 }
            type: html
            properties:
              content: '<div style="background:#60a5fa;border-radius:6px;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600">DOB</div>'
          - at: { x: 0, y: 3, w: 6, h: 2 }
            type: html
            properties:
              content: '<div style="background:#93c5fd;border-radius:6px;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600">Address</div>'
      - at: { x: 6, y: 1, w: 6, h: 5 }
        type: panel
        properties:
          title: Medical History
        grid:
          - at: { x: 0, y: 0, w: 6, h: 1 }
            type: html
            properties:
              content: '<div style="background:#8b5cf6;border-radius:6px;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600">Allergies</div>'
          - at: { x: 0, y: 1, w: 3, h: 1 }
            type: html
            properties:
              content: '<div style="background:#a78bfa;border-radius:6px;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600">Blood Type</div>'
          - at: { x: 3, y: 1, w: 3, h: 1 }
            type: html
            properties:
              content: '<div style="background:#a78bfa;border-radius:6px;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600">Weight</div>'
          - at: { x: 0, y: 2, w: 6, h: 2 }
            type: html
            properties:
              content: '<div style="background:#c4b5fd;border-radius:6px;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600">Conditions</div>'
          - at: { x: 0, y: 4, w: 6, h: 1 }
            type: html
            properties:
              content: '<div style="background:#c4b5fd;border-radius:6px;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600">Medications</div>'
      - at: { x: 0, y: 6, w: 4, h: 2 }
        type: html
        properties:
          content: '<div style="background:#22c55e;border-radius:6px;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600">Submit</div>'
      - at: { x: 4, y: 6, w: 4, h: 2 }
        type: html
        properties:
          content: '<div style="background:#64748b;border-radius:6px;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600">Save Draft</div>'
      - at: { x: 8, y: 6, w: 4, h: 2 }
        type: html
        properties:
          content: '<div style="background:#ef4444;border-radius:6px;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600">Cancel</div>'
