pages:
  - name: Content Layout
    grid:
      - at: { x: 0, y: 0, w: 4, h: 2 }
        type: title
        properties:
          text: Revenue Overview
          size: h3
      - at: { x: 4, y: 0, w: 8, h: 2 }
        type: markdown
        properties:
          content: >
            Nested grid test — the panel below contains a nested grid.
            Try drag-and-drop inside the nested grid, and try dragging
            items between the parent and nested grids.
      - at: { x: 0, y: 2, w: 6, h: 4 }
        type: panel
        properties:
          title: Nested Grid Panel
        grid:
          - at: { x: 0, y: 0, w: 3, h: 2 }
            type: markdown
            properties:
              content: Nested A
          - at: { x: 3, y: 0, w: 3, h: 2 }
            type: markdown
            properties:
              content: Nested B
          - at: { x: 0, y: 2, w: 6, h: 1 }
            type: markdown
            properties:
              content: Nested C — full width
      - at: { x: 6, y: 2, w: 6, h: 4 }
        type: markdown
        properties:
          content: >
            Panel D — in the parent grid. Try dragging this into the
            nested grid panel on the left.
      - at: { x: 0, y: 6, w: 12, h: 2 }
        type: markdown
        properties:
          content: >
            Full-width panel — spans all 12 columns.
