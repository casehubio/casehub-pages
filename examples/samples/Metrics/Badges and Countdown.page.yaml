datasets:
  - uuid: status-data
    content: |-
      [
        ["API Gateway", "healthy", "99.9"],
        ["Database", "healthy", "99.7"],
        ["Cache", "degraded", "95.2"],
        ["Queue", "healthy", "99.8"],
        ["Search", "down", "0.0"],
        ["Storage", "healthy", "99.5"]
      ]
    columns:
      - id: service
        type: LABEL
      - id: status
        type: LABEL
      - id: uptime
        type: NUMBER
  - uuid: launch-date
    content: '[["2026-08-01T00:00:00Z"]]'
    columns:
      - id: target
        type: DATE
pages:
  - name: Metrics Showcase
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
        type: title
        properties:
          text: Status Badges
          size: h2
      - at: { x: 0, y: 1, w: 12, h: 1 }
        type: markdown
        properties:
          content: |
            **Badge** components display a single value with a status colour. Useful for service health, build status, or any categorical indicator.
      - at: { x: 0, y: 2, w: 2, h: 1 }
        type: badge
        properties:
          lookup:
            uuid: status-data
            filter:
              - column: service
                function: EQUALS_TO
                args:
                  - API Gateway
      - at: { x: 2, y: 2, w: 2, h: 1 }
        type: badge
        properties:
          lookup:
            uuid: status-data
            filter:
              - column: service
                function: EQUALS_TO
                args:
                  - Database
      - at: { x: 4, y: 2, w: 2, h: 1 }
        type: badge
        properties:
          lookup:
            uuid: status-data
            filter:
              - column: service
                function: EQUALS_TO
                args:
                  - Cache
      - at: { x: 6, y: 2, w: 2, h: 1 }
        type: badge
        properties:
          lookup:
            uuid: status-data
            filter:
              - column: service
                function: EQUALS_TO
                args:
                  - Queue
      - at: { x: 8, y: 2, w: 2, h: 1 }
        type: badge
        properties:
          lookup:
            uuid: status-data
            filter:
              - column: service
                function: EQUALS_TO
                args:
                  - Search
      - at: { x: 10, y: 2, w: 2, h: 1 }
        type: badge
        properties:
          lookup:
            uuid: status-data
            filter:
              - column: service
                function: EQUALS_TO
                args:
                  - Storage
      - at: { x: 0, y: 3, w: 12, h: 1 }
        type: title
        properties:
          text: Standalone Badges
          size: h2
      - at: { x: 0, y: 4, w: 12, h: 1 }
        type: markdown
        properties:
          content: |
            **Standalone badges** from `@casehubio/pages-ui-components` — no data pipeline required. Use directly in any HTML page or Lit template with semantic variants.
      - at: { x: 0, y: 5, w: 12, h: 1 }
        type: html
        properties:
          content: |
            <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 16px 0;">
              <pages-badge label="Success" variant="success"></pages-badge>
              <pages-badge label="Warning" variant="warning"></pages-badge>
              <pages-badge label="Danger" variant="danger"></pages-badge>
              <pages-badge label="Neutral" variant="neutral"></pages-badge>
              <pages-badge label="Info" variant="info"></pages-badge>
              <pages-badge label="Accent" variant="accent"></pages-badge>
            </div>
      - at: { x: 0, y: 6, w: 12, h: 1 }
        type: markdown
        properties:
          content: |
            **Small badges** for compact lists and status indicators:
      - at: { x: 0, y: 7, w: 12, h: 1 }
        type: html
        properties:
          content: |
            <div style="display: flex; gap: 8px; align-items: center; padding: 16px 0;">
              <pages-badge label="Active" variant="success" size="sm"></pages-badge>
              <pages-badge label="Idle" variant="neutral" size="sm"></pages-badge>
              <pages-badge label="Waiting" variant="warning" size="sm"></pages-badge>
              <pages-badge label="Faulted" variant="danger" size="sm"></pages-badge>
            </div>
      - at: { x: 0, y: 8, w: 12, h: 1 }
        type: title
        properties:
          text: Status Dots
          size: h2
      - at: { x: 0, y: 9, w: 12, h: 1 }
        type: markdown
        properties:
          content: |
            **Status dots** — 8px coloured indicators for use alongside names in lists.
      - at: { x: 0, y: 10, w: 12, h: 1 }
        type: html
        properties:
          content: |
            <div style="display: flex; gap: 16px; align-items: center; padding: 16px 0; font-family: var(--pages-font-family, system-ui); font-size: 14px; color: var(--pages-neutral-12);">
              <span style="display: flex; align-items: center; gap: 6px;"><pages-status-dot variant="success"></pages-status-dot> Online</span>
              <span style="display: flex; align-items: center; gap: 6px;"><pages-status-dot variant="warning"></pages-status-dot> Away</span>
              <span style="display: flex; align-items: center; gap: 6px;"><pages-status-dot variant="danger"></pages-status-dot> Error</span>
              <span style="display: flex; align-items: center; gap: 6px;"><pages-status-dot variant="neutral"></pages-status-dot> Offline</span>
              <span style="display: flex; align-items: center; gap: 6px;"><pages-status-dot variant="info"></pages-status-dot> Info</span>
            </div>
      - at: { x: 0, y: 11, w: 12, h: 1 }
        type: markdown
        properties:
          content: |
            **Small dots** (6px) for compact lists:
      - at: { x: 0, y: 12, w: 12, h: 1 }
        type: html
        properties:
          content: |
            <div style="display: flex; gap: 16px; align-items: center; padding: 16px 0; font-family: var(--pages-font-family, system-ui); font-size: 12px; color: var(--pages-neutral-12);">
              <span style="display: flex; align-items: center; gap: 4px;"><pages-status-dot variant="success" size="sm"></pages-status-dot> Worker A</span>
              <span style="display: flex; align-items: center; gap: 4px;"><pages-status-dot variant="neutral" size="sm"></pages-status-dot> Worker B</span>
            </div>
      - at: { x: 0, y: 13, w: 12, h: 1 }
        type: title
        properties:
          text: Countdown Timer
          size: h2
      - at: { x: 0, y: 14, w: 12, h: 1 }
        type: markdown
        properties:
          content: |
            **Countdown** displays time remaining until a target date.
      - at: { x: 0, y: 15, w: 12, h: 1 }
        type: countdown
        properties:
          lookup:
            uuid: launch-date
