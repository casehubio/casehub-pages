pages:
  - name: index
    properties:
      margin: 16px
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
        type: title
        properties:
          text: Metric Density Patterns
          size: h2
      - at: { x: 0, y: 1, w: 12, h: 1 }
      - at: { x: 0, y: 2, w: 12, h: 1 }
        type: metric
        properties:
          title: Active Cases
          lookup:
            uuid: ds-cases
            group:
              - functions:
                  - source: val
                    function: SUM
      - at: { x: 0, y: 3, w: 12, h: 1 }
      - at: { x: 0, y: 4, w: 12, h: 1 }
        type: metric
        properties:
          title: Active Cases
          subtype: card2
          lookup:
            uuid: ds-cases
            group:
              - functions:
                  - source: val
                    function: SUM
      - at: { x: 0, y: 5, w: 12, h: 1 }
      - at: { x: 0, y: 6, w: 12, h: 1 }
        type: metric
        properties:
          title: Active Cases
          subtype: plain-text
          lookup:
            uuid: ds-cases
            group:
              - functions:
                  - source: val
                    function: SUM
      - at: { x: 0, y: 7, w: 12, h: 1 }
      - at: { x: 0, y: 8, w: 12, h: 1 }
        type: metric
        properties:
          title: CPU Usage
          subtype: quota
          lookup:
            uuid: ds-cpu
            group:
              - functions:
                  - source: used
                    function: SUM
                  - source: total
                    function: SUM
datasets:
  - uuid: ds-cases
    content: |-
      [
        ["cases", 12]
      ]
    columns:
      - id: name
        type: LABEL
      - id: val
        type: NUMBER
  - uuid: ds-cpu
    content: |-
      [
        ["cpu", 72, 100]
      ]
    columns:
      - id: name
        type: LABEL
      - id: used
        type: NUMBER
      - id: total
        type: NUMBER
