global:
  mode: dark
datasets:
  - uuid: test
    content: '[["Hello", 20, 12], ["World", 10, 25]]'
pages:
  - grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
        type: bar-chart
        properties:
          chart:
            resizable: true
          lookup:
            uuid: test
            group:
              - columnGroup:
                  source: Column 0
                functions:
                  - source: Column 0
                  - source: Column 1
                  - source: Column 2
