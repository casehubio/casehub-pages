pages:
  - name: Standalone UI Components
    components:
      - type: title
        properties:
          text: Standalone UI Components
          size: h1

      - type: markdown
        properties:
          content: |
            Standalone Lit web components from `@casehubio/pages-ui-components`.
            No data pipeline required — use directly in any HTML page or Lit template.

            Form components (input, select, textarea, checkbox) are shown in the **Forms** category.

      - type: title
        properties:
          text: Buttons
          size: h2

      - type: html
        properties:
          content: |
            <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 16px;">
              <pages-button label="Primary" variant="primary"></pages-button>
              <pages-button label="Secondary" variant="secondary"></pages-button>
              <pages-button label="Ghost" variant="ghost"></pages-button>
              <pages-button label="Danger" variant="danger"></pages-button>
              <pages-button label="Loading" variant="primary" loading></pages-button>
              <pages-button label="Disabled" variant="primary" disabled></pages-button>
            </div>

      - type: markdown
        properties:
          content: |
            **Sizes:** xs, sm, md (default), lg

      - type: html
        properties:
          content: |
            <div style="display: flex; gap: 12px; align-items: center; padding: 16px;">
              <pages-button label="Extra Small" variant="ghost" size="xs"></pages-button>
              <pages-button label="Small" variant="ghost" size="sm"></pages-button>
              <pages-button label="Medium" variant="ghost"></pages-button>
              <pages-button label="Large" variant="ghost" size="lg"></pages-button>
            </div>

      - type: title
        properties:
          text: Badges
          size: h2

      - type: html
        properties:
          content: |
            <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 16px;">
              <pages-badge label="Success" variant="success"></pages-badge>
              <pages-badge label="Warning" variant="warning"></pages-badge>
              <pages-badge label="Danger" variant="danger"></pages-badge>
              <pages-badge label="Neutral" variant="neutral"></pages-badge>
              <pages-badge label="Info" variant="info"></pages-badge>
              <pages-badge label="Accent" variant="accent"></pages-badge>
            </div>

      - type: markdown
        properties:
          content: |
            **Small badges:** for compact lists and status indicators

      - type: html
        properties:
          content: |
            <div style="display: flex; gap: 8px; align-items: center; padding: 16px;">
              <pages-badge label="Active" variant="success" size="sm"></pages-badge>
              <pages-badge label="Idle" variant="neutral" size="sm"></pages-badge>
              <pages-badge label="Waiting" variant="warning" size="sm"></pages-badge>
              <pages-badge label="Faulted" variant="danger" size="sm"></pages-badge>
            </div>

      - type: title
        properties:
          text: Status Dots
          size: h2

      - type: html
        properties:
          content: |
            <div style="display: flex; gap: 16px; align-items: center; padding: 16px; font-family: var(--pages-font-family, system-ui); font-size: 14px; color: var(--pages-neutral-12);">
              <span style="display: flex; align-items: center; gap: 6px;"><pages-status-dot variant="success"></pages-status-dot> Online</span>
              <span style="display: flex; align-items: center; gap: 6px;"><pages-status-dot variant="warning"></pages-status-dot> Away</span>
              <span style="display: flex; align-items: center; gap: 6px;"><pages-status-dot variant="danger"></pages-status-dot> Error</span>
              <span style="display: flex; align-items: center; gap: 6px;"><pages-status-dot variant="neutral"></pages-status-dot> Offline</span>
              <span style="display: flex; align-items: center; gap: 6px;"><pages-status-dot variant="info"></pages-status-dot> Info</span>
            </div>

      - type: markdown
        properties:
          content: |
            **Small dots** (6px):

      - type: html
        properties:
          content: |
            <div style="display: flex; gap: 16px; align-items: center; padding: 16px; font-family: var(--pages-font-family, system-ui); font-size: 12px; color: var(--pages-neutral-12);">
              <span style="display: flex; align-items: center; gap: 4px;"><pages-status-dot variant="success" size="sm"></pages-status-dot> Worker A</span>
              <span style="display: flex; align-items: center; gap: 4px;"><pages-status-dot variant="neutral" size="sm"></pages-status-dot> Worker B</span>
            </div>
