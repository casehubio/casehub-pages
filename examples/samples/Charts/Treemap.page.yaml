datasets:
  - uuid: departments
    content: |-
      [
        ["Engineering", 450],
        ["Sales", 280],
        ["Marketing", 150],
        ["Support", 120],
        ["HR", 60],
        ["Finance", 55],
        ["Legal", 35],
        ["Operations", 90],
        ["Product", 85],
        ["Design", 45]
      ]
    columns:
      - id: department
        type: LABEL
      - id: headcount
        type: NUMBER
  - uuid: org-tree
    content: |-
      [
        ["Company", 0, ""],
        ["Engineering", 450, "Company"],
        ["Frontend", 180, "Engineering"],
        ["Backend", 200, "Engineering"],
        ["DevOps", 70, "Engineering"],
        ["Sales", 280, "Company"],
        ["Enterprise", 160, "Sales"],
        ["SMB", 120, "Sales"],
        ["Operations", 150, "Company"],
        ["Support", 90, "Operations"],
        ["IT", 60, "Operations"]
      ]
    columns:
      - id: name
        type: LABEL
      - id: headcount
        type: NUMBER
      - id: parent
        type: LABEL
pages:
  - items:
      - placement:
          x: 0
          y: 0
          w: 6
          h: 1
        component:
          type: title
          properties:
            text: Flat Treemap
            size: h3
      - placement:
          x: 0
          y: 1
          w: 6
          h: 1
        component:
          type: treemap-chart
          properties:
            title: Department Headcount
            chart:
              height: 400
            lookup:
              uuid: departments
      - placement:
          x: 6
          y: 0
          w: 6
          h: 1
        component:
          type: title
          properties:
            text: Hierarchical Treemap
            size: h3
      - placement:
          x: 6
          y: 1
          w: 6
          h: 1
        component:
          type: treemap-chart
          properties:
            title: Org Structure
            parentColumn: parent
            chart:
              height: 400
            lookup:
              uuid: org-tree
