datasets:
  - uuid: pipeline
    content: |
      [
        ["API Gateway", "Auth Service"],
        ["API Gateway", "Rate Limiter"],
        ["Auth Service", "User Store"],
        ["Auth Service", "Token Cache"],
        ["User Store", "Database"],
        ["Token Cache", "Redis"],
        ["Rate Limiter", "Redis"],
        ["Database", "Backup"]
      ]
    columns:
      - id: from
        type: TEXT
      - id: to
        type: TEXT
  - uuid: products
    content: |
      [
        ["Widgets", 120, 95],
        ["Gadgets", 85, 110],
        ["Sprockets", 200, 180],
        ["Flanges", 60, 75],
        ["Bearings", 150, 140]
      ]
    columns:
      - id: product
        type: LABEL
      - id: q1
        type: NUMBER
      - id: q2
        type: NUMBER
  - uuid: monthly
    content: |
      [
        ["Jan", 10], ["Feb", 25], ["Mar", 18], ["Apr", 35],
        ["May", 28], ["Jun", 42], ["Jul", 38], ["Aug", 55],
        ["Sep", 48], ["Oct", 62], ["Nov", 58], ["Dec", 72]
      ]
    columns:
      - id: month
        type: LABEL
      - id: value
        type: NUMBER
  - uuid: pie-data
    content: |
      [
        ["Engineering", 45],
        ["Marketing", 20],
        ["Sales", 25],
        ["Support", 10]
      ]
    columns:
      - id: department
        type: LABEL
      - id: headcount
        type: NUMBER
pages:
  - name: SPI Broadening
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
        type: tabs
        properties:
          targetPage: true
