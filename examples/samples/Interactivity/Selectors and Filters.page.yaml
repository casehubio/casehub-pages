pages:
  - name: index
    properties:
      margin: 10px
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
        type: tabs
        properties:
          width: 100%
          navGroupId: SelectorsNav
          targetDivId: selectors_div
      - at: { x: 0, y: 1, w: 12, h: 1 }
  - name: Selectors
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
      - at: { x: 0, y: 1, w: 12, h: 1 }
      - at: { x: 0, y: 2, w: 12, h: 1 }
        type: selector
        properties:
          filter:
            enabled: true
            notification: true
            listening: false
            selfapply: false
          lookup:
            uuid: products
            group:
              - columnGroup:
                  source: Section
                functions:
                  - source: Section
      - at: { x: 0, y: 3, w: 12, h: 1 }
      - at: { x: 0, y: 4, w: 12, h: 1 }
        type: selector
        properties:
          subtype: labels
          filter:
            notification: true
          lookup:
            uuid: products
            group:
              - columnGroup:
                  source: Section
                functions:
                  - source: Section
      - at: { x: 0, y: 5, w: 12, h: 1 }
        type: bar-chart
        properties:
          filter:
            listening: true
          lookup:
            uuid: products
            group:
              - columnGroup:
                  source: Product
                functions:
                  - source: Product
                  - source: Quantity
                  - source: Quantity2
  - name: Filter with Chart
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
        type: selector
        properties:
          filter:
            enabled: true
            notification: true
          lookup:
            uuid: products
            group:
              - columnGroup:
                  source: Section
                functions:
                  - source: Section
      - at: { x: 0, y: 1, w: 12, h: 1 }
        type: bar-chart
        properties:
          filter:
            listening: true
          lookup:
            uuid: products
            group:
              - columnGroup:
                  source: Product
                functions:
                  - source: Product
                  - source: Quantity
                    function: SUM
                  - source: Quantity2
                    function: SUM
  - name: Filter with Table
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
        type: selector
        properties:
          subtype: labels
          filter:
            notification: true
          lookup:
            uuid: products
            group:
              - columnGroup:
                  source: Section
                functions:
                  - source: Section
      - at: { x: 0, y: 1, w: 12, h: 1 }
        type: data-table
        properties:
          filter:
            listening: true
          lookup:
            uuid: products
navTree:
  root_items:
    - type: GROUP
      id: SelectorsNav
      children:
        - page: Selectors
        - page: Filter with Chart
        - page: Filter with Table
datasets:
  - uuid: products
    content: |-
      [
        ["Computers", "Scanner", 5, 3],
        ["Computers", "Printer", 7, 4],
        ["Computers", "Laptop", 3, 2],
        ["Electronics", "Camera", 10, 7],
        ["Electronics", "Headphones", 5, 9]
      ]
    columns:
      - id: Section
        type: LABEL
      - id: Product
        type: LABEL
      - id: Quantity
        type: NUMBER
      - id: Quantity2
        type: NUMBER
