pages:
  - name: Alerts
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
        type: title
        properties:
          text: Alert Components
          size: h2
      - at: { x: 0, y: 1, w: 12, h: 1 }
        type: markdown
        properties:
          content: |
            **Alerts** display contextual messages with severity levels. Each severity has a distinct visual treatment. The `dismissible` property adds a close button.
      - at: { x: 0, y: 2, w: 12, h: 1 }
        type: title
        properties:
          text: Severity Levels
          size: h3
      - at: { x: 0, y: 3, w: 12, h: 1 }
      - at: { x: 0, y: 4, w: 12, h: 1 }
      - at: { x: 0, y: 5, w: 12, h: 1 }
      - at: { x: 0, y: 6, w: 12, h: 1 }
      - at: { x: 0, y: 7, w: 12, h: 1 }
        type: title
        properties:
          text: Dismissible Alerts
          size: h3
      - at: { x: 0, y: 8, w: 12, h: 1 }
        type: markdown
        properties:
          content: |
            Set `dismissible: true` to let users close the alert.
      - at: { x: 0, y: 9, w: 12, h: 1 }
      - at: { x: 0, y: 10, w: 12, h: 1 }
      - at: { x: 0, y: 11, w: 12, h: 1 }
        type: title
        properties:
          text: Alerts with Visibility
          size: h3
      - at: { x: 0, y: 12, w: 12, h: 1 }
        type: markdown
        properties:
          content: |
            Combine alerts with `visibleWhen` to show them conditionally — for example, only when a filter is active or a threshold is crossed.
