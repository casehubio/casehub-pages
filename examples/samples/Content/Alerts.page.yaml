pages:
  - name: Alerts
    items:
      - placement:
          x: 0
          y: 0
          w: 12
          h: 1
        component:
          type: title
          properties:
            text: Alert Components
            size: h2
      - placement:
          x: 0
          y: 1
          w: 12
          h: 1
        component:
          type: markdown
          properties:
            content: |
              **Alerts** display contextual messages with severity levels. Each severity has a distinct visual treatment. The `dismissible` property adds a close button.
      - placement:
          x: 0
          y: 2
          w: 12
          h: 1
        component:
          type: title
          properties:
            text: Severity Levels
            size: h3
      - placement:
          x: 0
          y: 3
          w: 12
          h: 1
        component:
          alert:
            severity: info
            content: System update scheduled for tonight at 23:00 UTC. No downtime expected.
      - placement:
          x: 0
          y: 4
          w: 12
          h: 1
        component:
          alert:
            severity: success
            content: Deployment v2.4.1 completed successfully. All health checks passing.
      - placement:
          x: 0
          y: 5
          w: 12
          h: 1
        component:
          alert:
            severity: warning
            content: Memory usage is above 85%. Consider scaling up or reviewing recent changes.
      - placement:
          x: 0
          y: 6
          w: 12
          h: 1
        component:
          alert:
            severity: error
            content: Database connection pool exhausted. 3 requests timed out in the last minute.
      - placement:
          x: 0
          y: 7
          w: 12
          h: 1
        component:
          type: title
          properties:
            text: Dismissible Alerts
            size: h3
      - placement:
          x: 0
          y: 8
          w: 12
          h: 1
        component:
          type: markdown
          properties:
            content: |
              Set `dismissible: true` to let users close the alert.
      - placement:
          x: 0
          y: 9
          w: 12
          h: 1
        component:
          alert:
            severity: info
            content: Welcome! This is your first visit. Click the close button to dismiss.
            dismissible: true
      - placement:
          x: 0
          y: 10
          w: 12
          h: 1
        component:
          alert:
            severity: warning
            content: Your session will expire in 10 minutes.
            dismissible: true
      - placement:
          x: 0
          y: 11
          w: 12
          h: 1
        component:
          type: title
          properties:
            text: Alerts with Visibility
            size: h3
      - placement:
          x: 0
          y: 12
          w: 12
          h: 1
        component:
          type: markdown
          properties:
            content: |
              Combine alerts with `visibleWhen` to show them conditionally — for example, only when a filter is active or a threshold is crossed.
