datasets:
  - uuid: data
    content: |-
      [
          ["A", 3],
          ["B", 2],
          ["C", 1],
          ["D", 0],
          ["E", -1],
          ["F", -2],
          ["G", -3]
      ]
pages:
  - grid:
      - at: { x: 0, y: 0, w: 4, h: 1 }
        type: title
        properties:
          text: All rows (rowCount 10)
          size: h3
      - at: { x: 0, y: 1, w: 4, h: 1 }
        type: line-chart
        properties:
          lookup:
            uuid: data
            rowCount: 10
      - at: { x: 4, y: 0, w: 4, h: 1 }
        type: title
        properties:
          text: Values > 0
          size: h3
      - at: { x: 4, y: 1, w: 4, h: 1 }
        type: bar-chart
        properties:
          lookup:
            uuid: data
            filter:
              - column: Column 1
                function: GREATER_THAN
                args:
                  - 0
      - at: { x: 8, y: 0, w: 4, h: 1 }
        type: title
        properties:
          text: Values < 0
          size: h3
      - at: { x: 8, y: 1, w: 4, h: 1 }
        type: bar-chart
        properties:
          subtype: bar
          lookup:
            uuid: data
            filter:
              - column: Column 1
                function: LOWER_THAN
                args:
                  - 0
