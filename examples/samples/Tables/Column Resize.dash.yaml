pages:
  - name: Column Resize
    components:
      - type: title
        properties:
          text: Column Resizing
          size: h2

      - type: markdown
        properties:
          content: |
            Demonstrates **column resizing** — drag the border between column
            headers to resize. Double-click a border to auto-fit the column
            to its widest visible content.

            Resized columns convert to fixed pixel widths. Untouched columns
            keep their original units (`fr`, `minmax`) — the CSS Grid engine
            redistributes remaining space naturally. Column widths are not
            persisted by the component; the consumer receives a `column-resize`
            event and stores widths as needed.

      - type: data-table
        properties:
          lookup:
            uuid: team-data
          sortable: true
          resizable: true
          columns:
            - id: department
              name: Dept
              width: "120px"
              minWidth: "80px"
            - id: team
              name: Team
              width: "100px"
              minWidth: "60px"
            - id: name
              name: Person
              width: "1fr"
              minWidth: "100px"
            - id: project
              name: Project
              width: "1fr"
              minWidth: "100px"
            - id: status
              name: Status
              width: "100px"
              minWidth: "60px"
            - id: quarter
              name: Quarter
              width: "80px"
              minWidth: "50px"
