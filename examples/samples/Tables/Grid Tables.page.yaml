pages:
  - name: Grid Tables
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
        type: title
        properties:
          text: Grid Table Patterns
          size: h2
      - at: { x: 0, y: 1, w: 12, h: 1 }
        type: markdown
        properties:
          content: |
            The `grid-table` component renders information grids — fixed-layout
            displays for feature matrices, status dashboards, scorecards, and
            cross-tabulations. Unlike `data-table`, there is no sorting, filtering,
            or pagination — just clean, styled information display.
      - at: { x: 0, y: 2, w: 12, h: 1 }
        type: title
        properties:
          text: Feature Matrix — boolean cells
          size: h3
      - at: { x: 0, y: 3, w: 12, h: 1 }
        type: grid-table
        properties:
          lookup:
            uuid: features
          columnHeaders: true
          rowHeaders: true
          cellDisplay:
            tests: boolean
            docs: boolean
            i18n: boolean
            a11y: boolean
      - at: { x: 0, y: 4, w: 12, h: 1 }
        type: title
        properties:
          text: Service Status — color cells
          size: h3
      - at: { x: 0, y: 5, w: 12, h: 1 }
        type: grid-table
        properties:
          lookup:
            uuid: service-status
          columnHeaders: true
          rowHeaders: true
          cellDisplay:
            mon: color
            tue: color
            wed: color
            thu: color
            fri: color
      - at: { x: 0, y: 6, w: 12, h: 1 }
        type: title
        properties:
          text: KPI Summary — row headers only
          size: h3
      - at: { x: 0, y: 7, w: 12, h: 1 }
        type: grid-table
        properties:
          lookup:
            uuid: kpi
          columnHeaders: false
          rowHeaders: true
      - at: { x: 0, y: 8, w: 12, h: 1 }
        type: title
        properties:
          text: Scorecard — badge + number cells
          size: h3
      - at: { x: 0, y: 9, w: 12, h: 1 }
        type: grid-table
        properties:
          lookup:
            uuid: scorecard
          columnHeaders: true
          rowHeaders: true
          cellDisplay:
            current: number
            previous: number
            status: badge
      - at: { x: 0, y: 10, w: 12, h: 1 }
        type: title
        properties:
          text: Permission Matrix — boolean cross-matrix
          size: h3
      - at: { x: 0, y: 11, w: 12, h: 1 }
        type: grid-table
        properties:
          lookup:
            uuid: permissions
          columnHeaders: true
          rowHeaders: true
          cellDisplay:
            read: boolean
            write: boolean
            approve: boolean
            admin: boolean
      - at: { x: 0, y: 12, w: 12, h: 1 }
        type: title
        properties:
          text: Comparison Table — text cross-matrix
          size: h3
      - at: { x: 0, y: 13, w: 12, h: 1 }
        type: grid-table
        properties:
          lookup:
            uuid: comparison
          columnHeaders: false
          rowHeaders: true
      - at: { x: 0, y: 14, w: 12, h: 1 }
        type: title
        properties:
          text: Quarterly Revenue — number cells
          size: h3
      - at: { x: 0, y: 15, w: 12, h: 1 }
        type: grid-table
        properties:
          lookup:
            uuid: quarterly
          columnHeaders: true
          rowHeaders: true
          cellDisplay:
            q1: number
            q2: number
            q3: number
            q4: number
      - at: { x: 0, y: 16, w: 12, h: 1 }
        type: title
        properties:
          text: Schedule Grid — plain text
          size: h3
      - at: { x: 0, y: 17, w: 12, h: 1 }
        type: grid-table
        properties:
          lookup:
            uuid: schedule
          columnHeaders: true
          rowHeaders: true
      - at: { x: 0, y: 18, w: 12, h: 1 }
        type: title
        properties:
          text: Data-only Grid — no headers
          size: h3
      - at: { x: 0, y: 19, w: 12, h: 1 }
        type: grid-table
        properties:
          lookup:
            uuid: quarterly
          columnHeaders: false
          rowHeaders: false
          cellDisplay:
            q1: number
            q2: number
            q3: number
            q4: number
      - at: { x: 0, y: 20, w: 12, h: 1 }
        type: title
        properties:
          text: Compact Grids — fixed width, tight padding
          size: h3
      - at: { x: 0, y: 21, w: 12, h: 1 }
        type: markdown
        properties:
          content: |
            `compact: true` shrinks the table to fit its content — no
            stretching to fill the container. Tighter padding and
            `nowrap` on cells.
      - at: { x: 0, y: 22, w: 12, h: 1 }
        type: columns
        properties:
          distribution:
            - 1
            - 1
      - at: { x: 0, y: 23, w: 12, h: 1 }
        type: title
        properties:
          text: Striped Rows — alternating row backgrounds
          size: h3
      - at: { x: 0, y: 24, w: 12, h: 1 }
        type: grid-table
        properties:
          lookup:
            uuid: schedule
          columnHeaders: true
          rowHeaders: true
          stripe: rows
      - at: { x: 0, y: 25, w: 12, h: 1 }
        type: title
        properties:
          text: Striped Columns — alternating column backgrounds
          size: h3
      - at: { x: 0, y: 26, w: 12, h: 1 }
        type: grid-table
        properties:
          lookup:
            uuid: quarterly
          columnHeaders: true
          rowHeaders: true
          stripe: columns
          cellDisplay:
            q1: number
            q2: number
            q3: number
            q4: number
      - at: { x: 0, y: 27, w: 12, h: 1 }
        type: title
        properties:
          text: Full Grid — vertical lines + row stripes
          size: h3
      - at: { x: 0, y: 28, w: 12, h: 1 }
        type: grid-table
        properties:
          lookup:
            uuid: permissions
          columnHeaders: true
          rowHeaders: true
          verticalLines: true
          stripe: rows
          cellDisplay:
            read: boolean
            write: boolean
            approve: boolean
            admin: boolean
      - at: { x: 0, y: 29, w: 12, h: 1 }
        type: title
        properties:
          text: Compact Full Grid — all options combined
          size: h3
      - at: { x: 0, y: 30, w: 12, h: 1 }
        type: grid-table
        properties:
          lookup:
            uuid: features
          columnHeaders: true
          rowHeaders: true
          compact: true
          verticalLines: true
          stripe: both
          cellDisplay:
            tests: boolean
            docs: boolean
            i18n: boolean
            a11y: boolean
