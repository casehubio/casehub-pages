datasets:
  - uuid: case-reviews
    content: |-
      [
        ["Engineering", "Case-1000", "Short row.", "Open"],
        ["Engineering", "Case-1001", "This patient requires urgent review due to multiple comorbidities including diabetes, hypertension, and chronic kidney disease. Prior authorization was denied on initial submission.", "Review"],
        ["Engineering", "Case-1002", "Medium length text that wraps to about two lines in a normal column width.", "Closed"],
        ["Design", "Case-1003", "Compliance review pending — the submitted evidence does not meet the threshold for regulatory requirement 4.2.1(a). Additional documentation has been requested from the submitting institution.", "Open"],
        ["Design", "Case-1004", "OK", "Review"],
        ["Design", "Case-1005", "The investigation revealed a pattern of structured deposits across three branch locations over a six-week period. Each deposit was calibrated to fall below the $10,000 reporting threshold.", "Closed"],
        ["Product", "Case-1006", "Routine check — no issues found.", "Open"],
        ["Product", "Case-1007", "Device telemetry shows intermittent temperature excursions in cold storage unit CS-22. Three readings exceeded the 8C threshold within a 48-hour window. Root cause analysis suggests a failing compressor relay.", "Review"],
        ["Product", "Case-1008", "Short row.", "Closed"],
        ["Operations", "Case-1009", "This patient requires urgent review due to multiple comorbidities including diabetes, hypertension, and chronic kidney disease.", "Open"],
        ["Operations", "Case-1010", "Medium length text.", "Review"],
        ["Operations", "Case-1011", "Compliance review pending — additional documentation requested.", "Closed"]
      ]
    columns:
      - id: department
        type: LABEL
      - id: case_id
        type: TEXT
      - id: description
        type: TEXT
      - id: status
        type: LABEL
pages:
  - name: Variable Heights
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
        type: title
        properties:
          text: Variable Row Heights + Column Resizing
          size: h2
      - at: { x: 0, y: 1, w: 12, h: 1 }
        type: markdown
        properties:
          content: |
            Five capabilities built on the single-grid CSS Grid model.
            Each tab demonstrates a different mode — auto-height rows,
            data-determined callback heights, column drag-resize,
            both combined, and auto-height with cell spanning.
      - at: { x: 0, y: 2, w: 12, h: 1 }
        type: tabs
        properties:
          targetPage: true
