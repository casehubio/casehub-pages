datasets:
  - uuid: devs
    content: |-
      [
        [1, "Alice Chen", "Java", 8],
        [2, "Bob Kim", "TypeScript", 3],
        [3, "Carlos Ruiz", "Python", 12],
        [4, "Diana Park", "Go", 5],
        [5, "Eve Johnson", "Java", 2],
        [6, "Frank Lee", "Rust", 7],
        [7, "Grace Wu", "TypeScript", 10],
        [8, "Henry Zhang", "Python", 4],
        [9, "Iris Chen", "Java", 6],
        [10, "Jack Taylor", "Go", 1]
      ]
    columns:
      - id: id
        type: NUMBER
      - id: name
        type: TEXT
      - id: language
        type: LABEL
      - id: workingYears
        type: NUMBER
pages:
  - name: Developer List
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
        type: title
        properties:
          text: Developer Registration
          size: h2
      - at: { x: 0, y: 1, w: 12, h: 1 }
        type: markdown
        properties:
          content: |
            Click a row to edit. Changes save automatically after 2 seconds.
            The bar chart updates with the table.
      - at: { x: 0, y: 2, w: 12, h: 1 }
        type: selector
        properties:
          subtype: labels
          filter:
            notification: true
          lookup:
            uuid: devs
            group:
              - columnGroup:
                  source: language
                functions:
                  - source: language
      - at: { x: 0, y: 3, w: 12, h: 1 }
        type: data-table
        properties:
          lookup:
            uuid: devs
          sortable: true
          filter:
            notification: true
            listening: true
      - at: { x: 0, y: 4, w: 12, h: 1 }
        type: bar-chart
        properties:
          subtype: column
          chart:
            height: 250
          filter:
            listening: true
          lookup:
            uuid: devs
            sort:
              - column: Total
                sortOrder: DESCENDING
            group:
              - columnGroup:
                  source: language
                  groupStrategy: DYNAMIC
                functions:
                  - source: language
                  - source: workingYears
                    function: SUM
                    column: Total
  - name: Edit Developer
    dataScope:
      dataset: devs
      idColumn: id
    save:
      trigger: auto
      delay: 2000
      adapter: local
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
        type: title
        properties:
          text: Edit Developer
          size: h3
      - at: { x: 0, y: 1, w: 12, h: 1 }
      - at: { x: 0, y: 2, w: 12, h: 1 }
      - at: { x: 0, y: 3, w: 12, h: 1 }
  - name: Edit Developer (Schema)
    dataScope:
      dataset: devs
      idColumn: id
    save:
      trigger: auto
      delay: 2000
      adapter: local
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
        type: title
        properties:
          text: Edit Developer (Schema Form)
          size: h3
      - at: { x: 0, y: 1, w: 12, h: 1 }
        type: markdown
        properties:
          content: |
            Same data as the DSL form, but driven by a single
            `schema-form:` component with explicit schema constraints.
      - at: { x: 0, y: 2, w: 12, h: 1 }
  - name: New Developer (Nested)
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
        type: title
        properties:
          text: New Developer (Nested Schema)
          size: h3
      - at: { x: 0, y: 1, w: 12, h: 1 }
        type: markdown
        properties:
          content: |
            Rich developer profile with nested address, skills array, and
            preferred contact method (oneOf). Demonstrates all nested form
            capabilities in a create-mode form.
      - at: { x: 0, y: 2, w: 12, h: 1 }
