datasets:
  - uuid: transaction
    content: |-
      [
        [1, "TXN-2026-04521", 125000, "USD", "true", "2026-07-06", "2026-07-06T14:30:00Z", "Multiple rapid transfers to high-risk jurisdictions.", "Acme Holdings Ltd", "Shell Corp 42 LLC"]
      ]
    columns:
      - id: id
        type: NUMBER
      - id: transactionId
        type: TEXT
      - id: amount
        type: NUMBER
      - id: currency
        type: LABEL
      - id: flagged
        type: LABEL
      - id: reportDate
        type: DATE
      - id: detectedAt
        type: DATE
      - id: notes
        type: TEXT
      - id: sender
        type: TEXT
      - id: receiver
        type: TEXT
pages:
  - name: Schema Form
    dataScope:
      dataset: transaction
      idColumn: id
    save:
      trigger: auto
      delay: 1000
      adapter: local
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
        type: title
        properties:
          text: Form Inputs
          size: h2
      - at: { x: 0, y: 1, w: 12, h: 1 }
        type: markdown
        properties:
          content: |
            Same AML transaction payload, three approaches. **Schema** passes
            one JSON Schema — full automation. **HTML** uses `type: html` for
            full layout control. **YAML** uses DSL form inputs — flat fields
            only.
      - at: { x: 0, y: 2, w: 12, h: 1 }
        type: tabs
        properties:
          targetPage: true
