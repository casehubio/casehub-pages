datasets:
  - uuid: contacts
    content: |-
      [
        [1, "Alice Johnson", "alice@example.com", "+1-555-0101", "Work", "true", "2024-03-15", "Key client contact", 1],
        [2, "Bob Smith", "bob@example.com", "+1-555-0102", "Personal", "true", "2023-11-20", "", 2],
        [3, "Carol Davis", "carol@example.com", "+1-555-0103", "Work", "false", "2025-01-08", "On leave until March", 3]
      ]
    columns:
      - id: id
        type: NUMBER
      - id: name
        type: TEXT
      - id: email
        type: TEXT
      - id: phone
        type: TEXT
      - id: category
        type: LABEL
      - id: active
        type: LABEL
      - id: startDate
        type: DATE
      - id: notes
        type: TEXT
      - id: priority
        type: NUMBER
pages:
  - name: Contact List
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
      - at: { x: 0, y: 1, w: 12, h: 1 }
        type: data-table
        properties:
          pageSize: 10
          sortable: true
          filter:
            enabled: true
            notification: true
          lookup:
            uuid: contacts
      - at: { x: 0, y: 2, w: 12, h: 1 }
  - name: Contact Form
    dataScope:
      dataset: contacts
      idColumn: id
    save:
      trigger: auto
      delay: 2000
      adapter: local
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
      - at: { x: 0, y: 1, w: 12, h: 1 }
      - at: { x: 0, y: 2, w: 12, h: 1 }
      - at: { x: 0, y: 3, w: 12, h: 1 }
      - at: { x: 0, y: 4, w: 12, h: 1 }
      - at: { x: 0, y: 5, w: 12, h: 1 }
      - at: { x: 0, y: 6, w: 12, h: 1 }
      - at: { x: 0, y: 7, w: 12, h: 1 }
  - name: Contact Form (Schema)
    dataScope:
      dataset: contacts
      idColumn: id
    save:
      trigger: auto
      delay: 2000
      adapter: local
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
        type: title
        properties:
          text: Contact Form (Schema-Driven)
          size: h3
      - at: { x: 0, y: 1, w: 12, h: 1 }
        type: markdown
        properties:
          content: |
            Same contact data, but the form is auto-generated from a schema.
            Field types, labels, and constraints come from the JSON Schema.
      - at: { x: 0, y: 2, w: 12, h: 1 }
  - name: Contact Form (Nested)
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
        type: title
        properties:
          text: Contact Form (Nested Schema)
          size: h3
      - at: { x: 0, y: 1, w: 12, h: 1 }
        type: markdown
        properties:
          content: |
            Nested schema form — address as a sub-object, contact method as a
            discriminated oneOf, and tags as an array. All from one JSON Schema.
      - at: { x: 0, y: 2, w: 12, h: 1 }
