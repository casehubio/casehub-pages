datasets:
  - uuid: tasks
    url: /api/apps/tasks/tasks
    mutable:
      keyColumn: id
      createUrl: /api/apps/tasks/tasks
      updateUrl: /api/apps/tasks/tasks/{id}
      deleteUrl: /api/apps/tasks/tasks/{id}
    columns:
      - id: id
        type: TEXT
      - id: title
        type: TEXT
      - id: description
        type: TEXT
      - id: priority
        type: LABEL
      - id: status
        type: LABEL
      - id: assignee
        type: TEXT
      - id: dueDate
        type: TEXT
      - id: tags
        type: TEXT
  - uuid: notes
    url: /api/apps/tasks/notes
    mutable:
      keyColumn: id
      createUrl: /api/apps/tasks/notes
      updateUrl: /api/apps/tasks/notes/{id}
      deleteUrl: /api/apps/tasks/notes/{id}
    columns:
      - id: id
        type: TEXT
      - id: title
        type: TEXT
      - id: content
        type: TEXT
      - id: category
        type: LABEL
      - id: author
        type: TEXT
      - id: pinned
        type: LABEL
pages:
  - name: index
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
        type: tabs
        properties:
          navGroupId: TasksNav
          width: 100%
  - name: Task Board
    grid:
      - at: { x: 0, y: 0, w: 3, h: 1 }
        type: title
        properties:
          text: Open Tasks
          size: h3
      - at: { x: 0, y: 1, w: 3, h: 1 }
        type: metric
        properties:
          lookup:
            uuid: tasks
            filter:
              - column: status
                function: NOT_EQUALS_TO
                args:
                  - DONE
              - column: status
                function: NOT_EQUALS_TO
                args:
                  - CANCELLED
            group:
              - functions:
                  - source: id
                    function: COUNT
          columns:
            - id: id
              pattern: "#"
      - at: { x: 3, y: 0, w: 3, h: 1 }
        type: title
        properties:
          text: Critical
          size: h3
      - at: { x: 3, y: 1, w: 3, h: 1 }
        type: metric
        properties:
          lookup:
            uuid: tasks
            filter:
              - column: priority
                function: EQUALS_TO
                args:
                  - CRITICAL
              - column: status
                function: NOT_EQUALS_TO
                args:
                  - DONE
            group:
              - functions:
                  - source: id
                    function: COUNT
          columns:
            - id: id
              pattern: "#"
      - at: { x: 6, y: 0, w: 3, h: 1 }
        type: title
        properties:
          text: In Progress
          size: h3
      - at: { x: 6, y: 1, w: 3, h: 1 }
        type: metric
        properties:
          lookup:
            uuid: tasks
            filter:
              - column: status
                function: EQUALS_TO
                args:
                  - IN_PROGRESS
            group:
              - functions:
                  - source: id
                    function: COUNT
          columns:
            - id: id
              pattern: "#"
      - at: { x: 9, y: 0, w: 3, h: 1 }
        type: title
        properties:
          text: Done
          size: h3
      - at: { x: 9, y: 1, w: 3, h: 1 }
        type: metric
        properties:
          lookup:
            uuid: tasks
            filter:
              - column: status
                function: EQUALS_TO
                args:
                  - DONE
            group:
              - functions:
                  - source: id
                    function: COUNT
          columns:
            - id: id
              pattern: "#"
      - at: { x: 0, y: 2, w: 4, h: 1 }
        type: title
        properties:
          text: By Priority
          size: h3
      - at: { x: 0, y: 3, w: 4, h: 1 }
        type: pie-chart
        properties:
          filter:
            listening: true
          lookup:
            uuid: tasks
            filter:
              - column: status
                function: NOT_EQUALS_TO
                args:
                  - DONE
              - column: status
                function: NOT_EQUALS_TO
                args:
                  - CANCELLED
            group:
              - columnGroup:
                  source: priority
                functions:
                  - source: priority
                  - source: id
                    function: COUNT
      - at: { x: 4, y: 2, w: 4, h: 1 }
        type: title
        properties:
          text: By Status
          size: h3
      - at: { x: 4, y: 3, w: 4, h: 1 }
        type: bar-chart
        properties:
          filter:
            listening: true
          lookup:
            uuid: tasks
            group:
              - columnGroup:
                  source: status
                functions:
                  - source: status
                  - source: id
                    function: COUNT
      - at: { x: 8, y: 2, w: 4, h: 1 }
        type: title
        properties:
          text: By Assignee
          size: h3
      - at: { x: 8, y: 3, w: 4, h: 1 }
        type: pie-chart
        properties:
          subtype: donut
          filter:
            listening: true
          lookup:
            uuid: tasks
            filter:
              - column: status
                function: NOT_EQUALS_TO
                args:
                  - DONE
              - column: assignee
                function: NOT_NULL
            group:
              - columnGroup:
                  source: assignee
                functions:
                  - source: assignee
                  - source: id
                    function: COUNT
      - at: { x: 0, y: 4, w: 12, h: 1 }
        type: data-table
        properties:
          pageSize: 15
          sortable: true
          filter:
            listening: true
            notification: true
          lookup:
            uuid: tasks
          columns:
            - id: title
            - id: priority
            - id: status
            - id: assignee
            - id: dueDate
  - name: Task Detail
    dataScope:
      dataset: tasks
      idColumn: id
    save:
      trigger: auto
      delay: 2000
      adapter: rest
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
        type: title
        properties:
          text: Task Detail
          size: h2
      - at: { x: 0, y: 1, w: 12, h: 1 }
      - at: { x: 0, y: 2, w: 12, h: 1 }
      - at: { x: 0, y: 3, w: 12, h: 1 }
      - at: { x: 0, y: 4, w: 12, h: 1 }
      - at: { x: 0, y: 5, w: 12, h: 1 }
      - at: { x: 0, y: 6, w: 12, h: 1 }
      - at: { x: 0, y: 7, w: 12, h: 1 }
  - name: New Task
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
        type: title
        properties:
          text: Create Task
          size: h2
      - at: { x: 0, y: 1, w: 12, h: 1 }
  - name: Notes
    grid:
      - at: { x: 0, y: 0, w: 4, h: 1 }
        type: selector
        properties:
          subtype: labels
          filter:
            selfApply: true
            notification: true
          lookup:
            uuid: notes
            group:
              - columnGroup:
                  source: category
                functions:
                  - source: category
      - at: { x: 0, y: 1, w: 12, h: 1 }
        type: data-table
        properties:
          pageSize: 10
          sortable: true
          filter:
            listening: true
          lookup:
            uuid: notes
          columns:
            - id: title
            - id: category
            - id: author
            - id: pinned
navTree:
  root_items:
    - type: GROUP
      id: TasksNav
      children:
        - page: Task Board
        - page: Task Detail
        - page: New Task
        - page: Notes
