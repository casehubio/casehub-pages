datasets:
  - uuid: langs
    content: |-
      [
          ["English", "Hello World", 1132],
          ["Mandarin", "你好世界", 1117],
          ["Hindi", "नमस्ते दुनिया", 615],
          ["Spanish", "Hola Mundo", 534],
          ["French", "Bonjour le monde", 280]
      ]
pages:
  - grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
      - at: { x: 0, y: 1, w: 12, h: 1 }
        type: bar-chart
        properties:
          chart:
            resizable: true
          lookup:
            uuid: langs
            group:
              - columnGroup:
                  source: Column 0
                functions:
                  - source: Column 0
                  - source: Column 2
      - at: { x: 0, y: 2, w: 12, h: 1 }
        type: data-table
        properties:
          chart:
            resizable: true
          lookup:
            uuid: langs
