datasets:
  - uuid: contacts
    url: /api/apps/contacts/contacts
    mutable:
      keyColumn: id
      createUrl: /api/apps/contacts/contacts
      updateUrl: /api/apps/contacts/contacts/{id}
      deleteUrl: /api/apps/contacts/contacts/{id}
    columns:
      - id: id
        type: TEXT
      - id: firstName
        type: TEXT
      - id: lastName
        type: TEXT
      - id: email
        type: TEXT
      - id: phone
        type: TEXT
      - id: company
        type: TEXT
      - id: role
        type: TEXT
      - id: category
        type: LABEL
      - id: status
        type: LABEL
pages:
  - name: index
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
        type: tabs
        properties:
          navGroupId: ContactsNav
          width: 100%
  - name: All Contacts
    grid:
      - at: { x: 0, y: 0, w: 4, h: 1 }
        type: selector
        properties:
          subtype: labels
          filter:
            selfApply: true
            notification: true
          lookup:
            uuid: contacts
            group:
              - columnGroup:
                  source: category
                functions:
                  - source: category
      - at: { x: 4, y: 0, w: 4, h: 1 }
        type: selector
        properties:
          subtype: labels
          filter:
            selfApply: true
            notification: true
          lookup:
            uuid: contacts
            group:
              - columnGroup:
                  source: status
                functions:
                  - source: status
      - at: { x: 0, y: 1, w: 12, h: 1 }
        type: data-table
        properties:
          pageSize: 15
          sortable: true
          filter:
            listening: true
            notification: true
          lookup:
            uuid: contacts
          columns:
            - id: firstName
            - id: lastName
            - id: email
            - id: company
            - id: category
            - id: status
  - name: Contact Detail
    dataScope:
      dataset: contacts
      idColumn: id
    save:
      trigger: auto
      delay: 2000
      adapter: rest
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
        type: title
        properties:
          text: Contact Detail
          size: h2
      - at: { x: 0, y: 1, w: 12, h: 1 }
      - at: { x: 0, y: 2, w: 12, h: 1 }
      - at: { x: 0, y: 3, w: 12, h: 1 }
      - at: { x: 0, y: 4, w: 12, h: 1 }
      - at: { x: 0, y: 5, w: 12, h: 1 }
      - at: { x: 0, y: 6, w: 12, h: 1 }
      - at: { x: 0, y: 7, w: 12, h: 1 }
      - at: { x: 0, y: 8, w: 12, h: 1 }
  - name: New Contact
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
        type: title
        properties:
          text: Add Contact
          size: h2
      - at: { x: 0, y: 1, w: 12, h: 1 }
  - name: By Company
    grid:
      - at: { x: 0, y: 0, w: 6, h: 1 }
        type: title
        properties:
          text: Contacts by Company
          size: h3
      - at: { x: 0, y: 1, w: 6, h: 1 }
        type: bar-chart
        properties:
          filter:
            listening: true
          lookup:
            uuid: contacts
            filter:
              - column: status
                function: EQUALS_TO
                args:
                  - ACTIVE
            group:
              - columnGroup:
                  source: company
                functions:
                  - source: company
                  - source: id
                    function: COUNT
      - at: { x: 6, y: 0, w: 6, h: 1 }
        type: title
        properties:
          text: By Category
          size: h3
      - at: { x: 6, y: 1, w: 6, h: 1 }
        type: pie-chart
        properties:
          filter:
            listening: true
          lookup:
            uuid: contacts
            filter:
              - column: status
                function: EQUALS_TO
                args:
                  - ACTIVE
            group:
              - columnGroup:
                  source: category
                functions:
                  - source: category
                  - source: id
                    function: COUNT
navTree:
  root_items:
    - type: GROUP
      id: ContactsNav
      children:
        - page: All Contacts
        - page: Contact Detail
        - page: New Contact
        - page: By Company
