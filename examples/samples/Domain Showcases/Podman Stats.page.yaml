properties:
  baseUrl: /data/podman
datasets:
  - uuid: images
    expression: $.[Id, Names[0], $fromMillis(Created * 1000), $round(Size / 1000000), Containers]
    url: ${baseUrl}/images/json
    columns:
      - id: ID
        type: label
      - id: name
        type: label
      - id: created
        type: date
      - id: Size (MB)
        type: number
      - id: containers
        type: number
  - uuid: containers
    expression: $.[Id, Names[0], Image, $fromMillis(Created * 1000), State, Status]
    url: ${baseUrl}/containers/json
    columns:
      - id: ID
        type: label
      - id: name
        type: label
      - id: image
        type: label
      - id: created
        type: date
      - id: State
        type: label
      - id: Status
        type: label
pages:
  - name: Images
    grid:
      - at: { x: 0, y: 0, w: 6, h: 1 }
      - at: { x: 0, y: 1, w: 6, h: 1 }
        type: bar-chart
        properties:
          subtype: bar
          chart:
            height: "350"
            margin:
              left: "120"
          lookup:
            uuid: images
            rowCount: 7
            group:
              - columnGroup:
                  source: name
                functions:
                  - source: name
                  - source: Size (MB)
                    column: Total Size (MB)
            sort:
              - column: Total Size (MB)
                sortOrder: DESCENDING
          extraConfiguration: |
            "series": {
              "label": {
                  "position": "top"
              }
            }
      - at: { x: 6, y: 0, w: 6, h: 1 }
      - at: { x: 6, y: 1, w: 6, h: 1 }
        type: bar-chart
        properties:
          subtype: bar
          chart:
            width: "500"
            height: "350"
            margin:
              left: "120"
          lookup:
            uuid: images
            rowCount: 7
            group:
              - columnGroup:
                  source: name
                functions:
                  - source: name
                  - source: containers
                    column: containers total
            sort:
              - column: containers total
                sortOrder: DESCENDING
            filter:
              - column: containers
                function: GREATER_THAN
                args:
                  - 0
          columns:
            - id: containers total
              pattern: "#"
      - at: { x: 0, y: 2, w: 12, h: 1 }
      - at: { x: 0, y: 3, w: 12, h: 1 }
        type: data-table
        properties:
          lookup:
            uuid: images
  - name: Containers
    grid:
      - at: { x: 0, y: 1, w: 12, h: 1 }
        properties:
          font-size: small
      - at: { x: 0, y: 2, w: 2, h: 1 }
        type: selector
        properties:
          filter:
            notification: "true"
          lookup:
            uuid: containers
            group:
              - columnGroup:
                  source: image
                functions:
                  - source: image
                    column: image
      - at: { x: 2, y: 2, w: 2, h: 1 }
        type: selector
        properties:
          filter:
            notification: true
          lookup:
            uuid: containers
            group:
              - columnGroup:
                  source: state
                functions:
                  - source: state
                    column: state
      - at: { x: 0, y: 3, w: 5, h: 1 }
        properties:
          font-size: medium
      - at: { x: 0, y: 4, w: 5, h: 1 }
        type: bar-chart
        properties:
          subtype: bar
          chart:
            width: "500"
            height: "350"
            margin:
              left: "70"
          filter:
            listening: true
          lookup:
            uuid: containers
            rowCount: 7
            group:
              - columnGroup:
                  source: state
                functions:
                  - source: state
                  - source: state
                    function: COUNT
                    column: total
          columns:
            - id: total
              pattern: "#"
      - at: { x: 5, y: 3, w: 6, h: 1 }
        properties:
          font-size: medium
      - at: { x: 5, y: 4, w: 6, h: 1 }
        type: bar-chart
        properties:
          subtype: bar
          chart:
            width: "500"
            height: "350"
            margin:
              left: "120"
          filter:
            listening: true
          lookup:
            uuid: containers
            rowCount: 7
            group:
              - columnGroup:
                  source: image
                functions:
                  - source: image
                  - source: image
                    function: Count
                    column: Total
            sort:
              - column: Total
                sortOrder: DESCENDING
      - at: { x: 0, y: 5, w: 12, h: 1 }
        properties:
          size: xl
      - at: { x: 0, y: 6, w: 12, h: 1 }
        type: data-table
        properties:
          lookup:
            uuid: containers
  - name: index
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
      - at: { x: 0, y: 1, w: 12, h: 1 }
        type: tabs
        properties:
          targetDivId: podman_tabs_div
          navGroupId: podman_nav_group
      - at: { x: 0, y: 2, w: 12, h: 1 }
        type: div
        properties:
          width: 100%
          divId: podman_tabs_div
navTree:
  root_items:
    - id: podman_nav_group
      type: GROUP
      name: Podman Dashboard
      children:
        - page: Containers
        - page: Images
