datasets:
  - uuid: team_members
    content: |-
      [
          ["Platform", "Alice Johnson", "Tech Lead", "alice@example.com", "Engineering"],
          ["Platform", "Bob Smith", "Senior Developer", "bob@example.com", "Engineering"],
          ["Platform", "Charlie Brown", "Developer", "charlie@example.com", "Engineering"],
          ["Platform", "Diana Ross", "QA Engineer", "diana@example.com", "Quality"],
          ["Data", "Eve Wilson", "Team Lead", "eve@example.com", "Engineering"],
          ["Data", "Frank Miller", "Data Engineer", "frank@example.com", "Engineering"],
          ["Data", "Grace Lee", "Analytics Engineer", "grace@example.com", "Engineering"],
          ["Data", "Henry Davis", "ML Engineer", "henry@example.com", "Research"],
          ["Frontend", "Iris Chen", "Team Lead", "iris@example.com", "Engineering"],
          ["Frontend", "Jack Taylor", "Senior Frontend Dev", "jack@example.com", "Engineering"],
          ["Frontend", "Karen White", "Frontend Developer", "karen@example.com", "Engineering"],
          ["Frontend", "Leo Martinez", "UX Engineer", "leo@example.com", "Design"]
      ]
    columns:
      - id: Team
        type: LABEL
      - id: Member
        type: LABEL
      - id: Role
        type: LABEL
      - id: Email
        type: LABEL
      - id: Department
        type: LABEL
pages:
  - name: Overview
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
      - at: { x: 0, y: 1, w: 12, h: 1 }
        type: title
        properties:
          text: Teams Overview
          size: h3
      - at: { x: 0, y: 2, w: 12, h: 1 }
        type: data-table
        properties:
          pageSize: 10
          sortable: true
          lookup:
            uuid: team_members
            group:
              - columnGroup:
                  source: Team
                functions:
                  - source: Team
                  - source: Member
                    function: JOIN
                    column: Members
                    separator: ", "
                  - source: Member
                    function: COUNT
                    column: Member Count
  - name: Team Detail
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
      - at: { x: 0, y: 1, w: 12, h: 1 }
        type: title
        properties:
          text: All Team Members
          size: h3
      - at: { x: 0, y: 2, w: 12, h: 1 }
        type: data-table
        properties:
          pageSize: 15
          sortable: true
          filter:
            listening: true
          lookup:
            uuid: team_members
  - name: Admin Settings
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
      - at: { x: 0, y: 1, w: 4, h: 1 }
        type: title
        properties:
          text: Total Teams
          size: h3
      - at: { x: 0, y: 2, w: 4, h: 1 }
        type: metric
        properties:
          lookup:
            uuid: team_members
            group:
              - functions:
                  - source: Team
                    function: COUNT
                    column: Count
          columns:
            - id: Count
              pattern: "#,##0"
      - at: { x: 4, y: 1, w: 4, h: 1 }
        type: title
        properties:
          text: Total Members
          size: h3
      - at: { x: 4, y: 2, w: 4, h: 1 }
        type: metric
        properties:
          lookup:
            uuid: team_members
            group:
              - functions:
                  - source: Member
                    function: COUNT
                    column: Count
          columns:
            - id: Count
              pattern: "#,##0"
      - at: { x: 8, y: 1, w: 4, h: 1 }
        type: title
        properties:
          text: Departments
          size: h3
      - at: { x: 8, y: 2, w: 4, h: 1 }
        type: metric
        properties:
          lookup:
            uuid: team_members
            group:
              - functions:
                  - source: Department
                    function: COUNT
                    column: Count
          columns:
            - id: Count
              pattern: "#,##0"
