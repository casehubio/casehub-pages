datasets:
  - uuid: inventory
    content: |-
      [
        ["Widgets", "Widget A", 142, "In Stock"],
        ["Widgets", "Widget B", 38, "Low Stock"],
        ["Widgets", "Widget C", 210, "In Stock"],
        ["Gadgets", "Gadget X", 0, "Out of Stock"],
        ["Gadgets", "Gadget Y", 85, "In Stock"],
        ["Gadgets", "Gadget Z", 12, "Low Stock"],
        ["Parts", "Part Alpha", 500, "In Stock"],
        ["Parts", "Part Beta", 67, "In Stock"],
        ["Parts", "Part Gamma", 3, "Low Stock"]
      ]
    columns:
      - id: category
        type: LABEL
      - id: product
        type: TEXT
      - id: quantity
        type: NUMBER
      - id: status
        type: LABEL
pages:
  - name: Split and Dock
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
        type: title
        properties:
          text: Split and Dock
          size: h2
      - at: { x: 0, y: 1, w: 12, h: 1 }
        type: markdown
        properties:
          content: |
            **Split** creates resizable panes with a draggable divider. Drag the handle between panes to resize.
      - at: { x: 0, y: 2, w: 12, h: 1 }
        type: tabs
        properties:
          targetPage: true
