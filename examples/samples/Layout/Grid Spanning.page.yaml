pages:
  - name: Grid Spanning
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
        type: title
        properties:
          text: Grid Spanning
          size: h2
      - at: { x: 0, y: 1, w: 12, h: 1 }
        type: markdown
        properties:
          content: |
            Grid items can span multiple columns and rows using `w` and `h` in their placement. `mode: positioned` gives explicit `{x, y, w, h}` coordinates. `mode: auto` uses CSS auto-flow with span-only sizing.
      - at: { x: 0, y: 2, w: 12, h: 1 }
        type: title
        properties:
          text: Positioned Items — Explicit Coordinates
          size: h4
      - at: { x: 0, y: 3, w: 4, h: 3 }
      - at: { x: 4, y: 3, w: 8, h: 1 }
      - at: { x: 4, y: 4, w: 4, h: 2 }
      - at: { x: 8, y: 4, w: 2, h: 1 }
      - at: { x: 10, y: 4, w: 2, h: 1 }
      - at: { x: 8, y: 5, w: 4, h: 1 }
      - at: { x: 0, y: 6, w: 6, h: 2 }
      - at: { x: 6, y: 6, w: 6, h: 2 }
      - at: { x: 0, y: 8, w: 12, h: 1 }
        type: title
        properties:
          text: Auto-Placed Items — Span Only, No Coordinates
          size: h4
      - at: { w: 3, h: 1 }
      - at: { w: 3, h: 1 }
      - at: { w: 6, h: 1 }
      - at: { w: 12, h: 1 }
