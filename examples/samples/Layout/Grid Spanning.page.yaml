        properties:
          content: '<div style="background:#a3a3a3;border-radius:6px;height:100%;display:flex;align-items:center;justify-content:center;color:white;font-weight:600">w:6</div>'
      - at: { w: 12, h: 1 }
        type: html
        properties:
          content: '<div style="background:#57534e;border-radius:6px;height:100%;display:flex;align-items:center;justify-content:center;color:white;font-weight:600">w:12 (full width)</div>'
