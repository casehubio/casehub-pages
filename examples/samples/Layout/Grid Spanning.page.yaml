pages:
- name: Grid Spanning
  items:
    - placement: { mode: positioned, x: 0, y: 0, w: 12, h: 1 }
      component:
        type: title
        properties:
          text: Grid Spanning
          size: h2

    - placement: { mode: positioned, x: 0, y: 1, w: 12, h: 1 }
      component:
        type: markdown
        properties:
          content: >
            Grid items can span multiple columns and rows using `w` and `h`
            in their placement. `mode: positioned` gives explicit `{x, y, w, h}`
            coordinates. `mode: auto` uses CSS auto-flow with span-only sizing.

    - placement: { mode: positioned, x: 0, y: 2, w: 12, h: 1 }
      component:
        type: title
        properties:
          text: Positioned Items — Explicit Coordinates
          size: h4

    - placement: { mode: positioned, x: 0, y: 3, w: 4, h: 3 }
      component:
        html: >
          <div style="background: #1a6b5a; border-radius: 8px; padding: 16px;
                      height: 100%; min-height: 180px; box-sizing: border-box; display: flex;
                      flex-direction: column; justify-content: center; align-items: center;
                      color: white; font-family: sans-serif;">
            <div style="font-size: 2em; font-weight: bold;">4 × 3</div>
            <div style="opacity: 0.7; margin-top: 4px;">4 cols, 3 rows</div>
          </div>

    - placement: { mode: positioned, x: 4, y: 3, w: 8, h: 1 }
      component:
        html: >
          <div style="background: #2563eb; border-radius: 8px; padding: 16px;
                      height: 100%; min-height: 50px; box-sizing: border-box; display: flex;
                      justify-content: center; align-items: center;
                      color: white; font-family: sans-serif;">
            <span style="font-size: 1.5em; font-weight: bold;">8 × 1</span>
            <span style="opacity: 0.7; margin-left: 12px;">8 cols, 1 row</span>
          </div>

    - placement: { mode: positioned, x: 4, y: 4, w: 4, h: 2 }
