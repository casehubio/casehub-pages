datasets:
  - uuid: layout-data
    content: |-
      [
        ["Dashboard", "Overview metrics and charts", 12, "Active"],
        ["Reports", "Generated analysis reports", 8, "Active"],
        ["Settings", "Configuration and preferences", 3, "Draft"],
        ["Users", "Team member management", 24, "Active"]
      ]
    columns:
      - id: section
        type: LABEL
      - id: description
        type: TEXT
      - id: items
        type: NUMBER
      - id: status
        type: LABEL
pages:
  - name: Layout Patterns
    grid:
      - at: { x: 0, y: 0, w: 12, h: 1 }
        type: title
        properties:
          text: Layout Patterns
          size: h2
      - at: { x: 0, y: 1, w: 12, h: 1 }
        type: markdown
        properties:
          content: |
            Interactive containers for organising dashboard content. Click each tab to see the pattern in action.
      - at: { x: 0, y: 2, w: 12, h: 1 }
        type: tabs
        properties:
          targetPage: true
