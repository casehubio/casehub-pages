playbook: "1.0"
schema: client
---
meta:
  title: "Pause / Resume"
  description: "Consumer lifecycle — a named consumer reads from a channel, is stopped by a control step, and a new consumer restarts consumption."
  tags:
    - from
    - consumer
    - stop
    - lifecycle
    - flow-control
---
- concurrent:
    producer:
      - log: { message: "Sending batch 1" }
        publish: { channel: events, data: { batch: 1 } }
        loop: 3
      - delay: 500ms
      - log: { message: "Sending batch 2" }
        publish: { channel: events, data: { batch: 2 } }
        loop: 3

    consumer:
      - step: reader
        log: { message: "Reading ${from.batch}" }
        from: { channel: events, name: primary-reader }
        loop: continuous
        cancel: shutdown

    controller:
      - delay: 200ms
      - stop: primary-reader
      - log: { message: "Consumer stopped" }
