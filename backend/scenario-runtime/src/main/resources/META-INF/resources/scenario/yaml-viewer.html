<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scenario YAML Source</title>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      overflow: hidden;
    }
    pages-scenario-yaml-viewer {
      position: static;
      display: block;
      height: 100vh;
    }
  </style>
</head>
<body>
  <pages-scenario-yaml-viewer id="viewer" mode="standalone"></pages-scenario-yaml-viewer>
  <script>
    var params = new URLSearchParams(window.location.search);
    var viewer = document.getElementById('viewer');
    var baseUrl = params.get('baseUrl') || window.location.origin;
    var scenario = params.get('scenario') || '';
    viewer.setAttribute('baseurl', baseUrl);
    if (scenario) viewer.setAttribute('scenario', scenario);
  </script>
  <script type="module">
    import '/scenario/controller.js';
  </script>
</body>
</html>
