scenario: caller-script
steps:
  - label: "Navigate to users"
    target: browser
    commands:
      - action: navigate
        value: "#users"
  - label: "Create Alice"
    target: browser
    commands:
      - action: call
        script: callee-create-user
        params:
          userName: "Alice"
          userRole: "Admin"
  - label: "Verify done"
    target: browser
    commands:
      - action: click
        target: {role: button, name: "Done"}
