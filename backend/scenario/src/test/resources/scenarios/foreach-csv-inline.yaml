scenario: foreach-csv-inline
data:
  members:
    inline: |
      name:string,role:string,admin:boolean
      Alice,Developer,true
      Bob,Viewer,false
steps:
  - label: "Create member"
    target: browser
    forEach:
      as: member
      in: members
    commands:
      - action: fill
        target: {role: textbox, name: "Full Name"}
        value: "${each.member.name}"
  - label: "Grant admin"
    target: browser
    forEach:
      as: member
      in: members
    when: "${each.member.admin}"
    commands:
      - action: click
        target: {role: button, name: "Grant Admin"}
