name: "CodeQL Configuration"

paths-ignore:
  # Exclude Maven target directories containing third-party dependencies
  - "**/target/**"
  # Exclude node_modules (common practice)
  - "**/node_modules/**"
  # Exclude distribution/build outputs
  - "**/dist/**"
  - "**/build/**"
  # Generated standalone bundle; analyze its canonical packages/pages-aria/src TypeScript instead.
  - "backend/playbook-runtime/src/main/resources/META-INF/resources/playbook/controller.js"

queries:
  - uses: security-and-quality
