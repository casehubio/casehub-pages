name: Maven Build and Publish

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'packages/**'
      - 'components/**'
      - 'webapp/**'
      - 'npm-packages/**'
      - '.github/workflows/maven-publish.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'packages/**'
      - 'components/**'
      - 'webapp/**'
      - 'npm-packages/**'
      - '.github/workflows/maven-publish.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build and test
        run: cd backend && mvn --batch-mode verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: github.event_name != 'pull_request'
        run: cd backend && mvn --batch-mode deploy -DskipTests -DaltDeploymentRepository=github::https://maven.pkg.github.com/casehubio/casehub-pages -DaltSnapshotDeploymentRepository=github::https://maven.pkg.github.com/casehubio/casehub-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all packages
        run: yarn build
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Install webapp artifact
        run: mvn -f webapp/pom.xml --batch-mode install

      - name: Install npm-packages artifact
        run: mvn -f npm-packages/pom.xml --batch-mode install
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish frontend artifacts to GitHub Packages
        if: github.event_name != 'pull_request'
        run: |
          mvn -f webapp/pom.xml --batch-mode deploy -DaltDeploymentRepository=github::https://maven.pkg.github.com/casehubio/casehub-pages -DaltSnapshotDeploymentRepository=github::https://maven.pkg.github.com/casehubio/casehub-pages
          mvn -f npm-packages/pom.xml --batch-mode deploy -DaltDeploymentRepository=github::https://maven.pkg.github.com/casehubio/casehub-pages -DaltSnapshotDeploymentRepository=github::https://maven.pkg.github.com/casehubio/casehub-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-downstream:
    needs: [backend, frontend-artifacts]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Trigger downstream CI
        run: |
          for repo in aml chat-app claudony clinical devtown drafthouse iot life openclaw; do
            gh api repos/casehubio/$repo/dispatches \
              -f event_type=upstream-published \
              -f client_payload[source]="${GITHUB_REPOSITORY}" \
              2>/dev/null && echo "  ✅ $repo triggered" || echo "  ⚠️  $repo trigger failed"
          done
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
