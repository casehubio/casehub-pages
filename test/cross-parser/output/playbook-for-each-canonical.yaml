playbook: "1.0"
schema: server
name: for-each-composition
meta:
  title: "For-Each Composition"
  level: 3
  layer: composition
  teaches: "iterating over collections with for-each"
  builds-on:
    - sequential
    - modules

variables:
  env:
    regions: "us-east,eu-west,ap-south"

imports:
  - module: region-setup
    as: region
    for-each:
      as: region
      in: [ "us-east", "eu-west", "ap-south" ]
    parameters:
      name: "${each.region}"
